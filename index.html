/* ── UI ── */
function Toggle({checked,onChange,label,strikethrough,dark}) {

  return (<div style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer",userSelect:"none",padding:"5px 0"}} onClick={()=>onChange(!checked)}><div style={{width:38,height:21,borderRadius:11,background:checked?"#16a34a":"#cbd5e1",position:"relative",transition:"background .2s",flexShrink:0}}><div style={{width:17,height:17,borderRadius:9,background:"#fff",position:"absolute",top:2,left:checked?19:2,transition:"left .2s",boxShadow:"0 1px 3px rgba(0,0,0,.2)"}}/></div><span style={{fontSize:13,color:txtColor,textDecoration:strikethrough&&checked?"line-through":"none"}}>{label}</span></div>);
}
function BackBtn({onClick,label}) {
  return (<button onClick={onClick} style={{background:"none",border:"none",color:"rgba(255,255,255,.6)",fontSize:13,cursor:"pointer",display:"flex",alignItems:"center",gap:6,padding:"6px 0",fontWeight:500}}><span style={{fontSize:18}}>←</span> {label||"Voltar"}</button>);
}
function Pill({active,label,color}) {
  const c=color||"#16a34a";
  return (<div style={{display:"flex",alignItems:"center",gap:5,padding:"3px 7px",borderRadius:5,background:active?c+"14":"#f1f5f9",border:"1px solid "+(active?c+"30":"#e2e8f0"),fontSize:10,color:active?c:"#94a3b8",fontWeight:500}}><span style={{width:5,height:5,borderRadius:3,background:active?c:"#cbd5e1"}}/>{label}</div>);
}
function MapEmbed({lat,lng}) {

  const url="https://www.openstreetmap.org/export/embed.html?bbox="+(lng-.006)+"%2C"+(lat-.004)+"%2C"+(lng+.006)+"%2C"+(lat+.004)+"&layer=mapnik&marker="+lat+"%2C"+lng;

}
function WBox({children,style:sx}) {

}
function WTitle({icon,text,right}) {

}
function TagBadge({tag,small,onClick,removable,onRemove}) {

/* ── Weather Widget ── */
const WEATHER_LOCATIONS = [
  {name:"Santa Maria da Feira",lat:40.9273,lng:-8.5425},
  {name:"Oliveira de Azeméis",lat:40.8387,lng:-8.4774},
  {name:"São João da Madeira",lat:40.9005,lng:-8.4907},
  {name:"Ovar",lat:40.8597,lng:-8.6266},
  {name:"Vale de Cambra",lat:40.8431,lng:-8.3955},
  {name:"Arouca",lat:40.9299,lng:-8.2451},
  {name:"Cortegaça",lat:40.9142,lng:-8.7289},
  {name:"Cesar",lat:40.8653,lng:-8.4445},
];
function WeatherW() {
  const [weather,setWeather] = useState(null);
  const [locIdx,setLocIdx] = useState(() => {try{return parseInt(localStorage.getItem('go-weather-loc'))||0;}catch(e){return 0;}});
  const [showLoc,setShowLoc] = useState(false);
  const loc = WEATHER_LOCATIONS[locIdx]||WEATHER_LOCATIONS[0];
  useEffect(() => {
    setWeather(null);
    fetch("https://api.open-meteo.com/v1/forecast?latitude="+loc.lat+"&longitude="+loc.lng+"&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weathercode&timezone=Europe/Lisbon&forecast_days=7")
      .then(r => r.json()).then(d => setWeather(d.daily)).catch(() => {});
  },[locIdx]);
  const changeLoc = (i) => {setLocIdx(i);try{localStorage.setItem('go-weather-loc',i);}catch(e){}setShowLoc(false);};
  if (!weather) return (<WBox><WTitle icon="🌤️" text="Meteorologia"/><div style={{color:"#64748b",fontSize:11,textAlign:"center",padding:8}}>A carregar...</div></WBox>);
  return (
    <WBox>
      <WTitle icon="🌤️" text={"Meteorologia — "+loc.name} right={<button onClick={()=>setShowLoc(!showLoc)} style={{background:"none",border:"1px solid #475569",borderRadius:4,color:"#94a3b8",cursor:"pointer",fontSize:10,padding:"2px 8px"}}>📍</button>}/>
      {showLoc&&(<div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:8}}>{WEATHER_LOCATIONS.map((l,i)=>(<button key={i} onClick={()=>changeLoc(i)} style={{padding:"4px 10px",borderRadius:6,border:"1px solid "+(i===locIdx?"#f59e0b":"#475569"),background:i===locIdx?"#f59e0b20":"transparent",color:i===locIdx?"#f59e0b":"#94a3b8",fontSize:10,fontWeight:i===locIdx?600:400,cursor:"pointer"}}>{l.name}</button>))}</div>)}
      <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:4}}>
        {weather.time.map((t,i) => {
          const d = new Date(t); const isToday = i===0;
          const dayName = isToday ? "Hoje" : i===1 ? "Amanhã" : WDSHORT[d.getDay()];
          const icon = WC[weather.weathercode[i]] || "🌤️";
          const rain = weather.precipitation_sum[i];
          return (
            <div key={i} style={{minWidth:72,textAlign:"center",padding:"8px 6px",borderRadius:8,background:isToday?"#f59e0b15":"#0f172a",border:isToday?"1px solid #f59e0b30":"1px solid transparent"}}>
              <div style={{fontSize:10,fontWeight:isToday?700:500,color:isToday?"#f59e0b":"#94a3b8",marginBottom:4}}>{dayName}</div>
              <div style={{fontSize:22,marginBottom:4}}>{icon}</div>
              <div style={{fontSize:12,fontWeight:700,color:"#fff"}}>{Math.round(weather.temperature_2m_max[i])}°</div>
              <div style={{fontSize:10,color:"#64748b"}}>{Math.round(weather.temperature_2m_min[i])}°</div>
              {rain > 0 && <div style={{fontSize:9,color:"#3b82f6",marginTop:2}}>💧{rain}mm</div>}
            </div>
          );
        })}
      </div>
    </WBox>
  );
}

/* ── All Obras Map ── */
function AllObrasMap({obras,onSelect}) {
  const mapRef = useRef(null);
  const mapInstance = useRef(null);
  const obrasWithCoords = obras.filter(o => !o.arquivada && o.latitude && o.longitude && !isNaN(parseFloat(o.latitude)));

  useEffect(() => {
    if (!mapRef.current || obrasWithCoords.length === 0) return;
    if (mapInstance.current) { mapInstance.current.remove(); mapInstance.current = null; }
    const map = L.map(mapRef.current).setView([40.84,-8.48],11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM',maxZoom:18}).addTo(map);
    const bounds = [];
    obrasWithCoords.forEach(o => {
      const lat = parseFloat(o.latitude), lng = parseFloat(o.longitude);
      const m = TM[o.tipo];
      const marker = L.circleMarker([lat,lng],{radius:8,fillColor:m.accent,color:"#fff",weight:2,fillOpacity:.8}).addTo(map);
      marker.bindPopup("<b>"+o.tipo+" — "+(o.numero||"—")+"</b><br/>"+(o.designacao||"")+"<br/>📍 "+(o.concelho||""));
      marker.on('click',() => { if (onSelect) onSelect(o); });
      bounds.push([lat,lng]);
    });
    if (bounds.length > 0) map.fitBounds(bounds,{padding:[30,30]});
    mapInstance.current = map;
    return () => { if (mapInstance.current) { mapInstance.current.remove(); mapInstance.current = null; } };
  },[obrasWithCoords.length]);

  if (obrasWithCoords.length === 0) {
    return (<WBox><WTitle icon="🗺️" text="Mapa de Obras"/><div style={{color:"#64748b",fontSize:11,textAlign:"center",padding:12}}>Sem obras com coordenadas</div></WBox>);
  }
  return (
    <WBox>
      <WTitle icon="🗺️" text={"Mapa de Obras ("+obrasWithCoords.length+")"}/>
      <div style={{display:"flex",gap:8,marginBottom:8,flexWrap:"wrap"}}>
        {TIPOS.map(t => {const c=obrasWithCoords.filter(o=>o.tipo===t).length;return c>0 && (<div key={t} style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:"#94a3b8"}}><span style={{width:8,height:8,borderRadius:4,background:TM[t].accent}}/>{t}: {c}</div>);})}
      </div>
      <div ref={mapRef} style={{height:250,borderRadius:10}}/>
    </WBox>
  );
}

/* ── Alerts ── */
function getAlerts(obras) {
  const al=[];
  obras.filter(o=>!o.arquivada&&!o.concluida).forEach(o=>{
    const lim=o.alertaDias||10;const h=o.historicoEstados||[];const d2=h.length>0?h[h.length-1].data:o.dataCriacao;const de=daysAgo(d2);
    if(d2&&de>=lim) al.push({tipo:"estado",obra:o,dias:de,msg:"Sem mudança há "+de+"d"});
    if(o.corteMarcado&&o.dataCorte){const dd=daysBetween(new Date().toISOString(),o.dataCorte);if(dd>=0&&dd<=3) al.push({tipo:"corte",obra:o,dias:dd,msg:dd===0?"Corte HOJE!":"Corte em "+dd+"d"});}
    if(o.problemasMateriais) al.push({tipo:"mat",obra:o,dias:0,msg:"Problema materiais"});
  });
  al.sort((a,b)=>a.tipo==="corte"?-1:b.tipo==="corte"?1:b.dias-a.dias);return al;
}
const aI={estado:"🔴",corte:"🟠",mat:"⚠️"};const aC2={estado:"#dc2626",corte:"#ea580c",mat:"#dc2626"};

/* ── Activity Feed ── */
function getActivity(obras) {
  const acts=[];
  obras.filter(o=>!o.arquivada).forEach(o=>{
    (o.historicoEstados||[]).forEach(h=>acts.push({date:h.data,icon:"🔄",text:(o.numero||"—")+" → "+h.estado,tipo:o.tipo}));
    (o.tarefas||[]).filter(t=>t.concluida&&t.dataConclusao).forEach(t=>acts.push({date:t.dataConclusao,icon:"✅",text:(o.numero||"—")+" — "+t.texto,tipo:o.tipo}));
    (o.visitas||[]).forEach(v=>acts.push({date:v.data,icon:"👷",text:(o.numero||"—")+" — visita: "+v.notas.slice(0,40),tipo:o.tipo}));
  });
  acts.sort((a,b)=>new Date(b.date)-new Date(a.date));return acts.slice(0,10);
}

/* ── PDF Report ── */
function generateWeeklyPDF(obras, events, todos) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
  const pw = 210, ph = 297, mx = 15, cw = pw - mx * 2;
  let cy = 0;
  const today = new Date();
  const dateStr = today.getDate() + " de " + MP[today.getMonth()] + " de " + today.getFullYear();

  const checkPage = (need) => { if (cy + need > ph - 15) { doc.addPage(); cy = 15; } };
  const drawLine = (y, color) => { doc.setDrawColor(...(color || [241, 245, 249])); doc.setLineWidth(0.3); doc.line(mx, y, pw - mx, y); };

  // Header
  doc.setFillColor(15, 23, 42); doc.rect(0, 0, pw, 36, "F");
  doc.setFillColor(245, 158, 11); doc.rect(0, 34, pw, 2, "F");
  doc.setFont("helvetica", "bold"); doc.setFontSize(18); doc.setTextColor(255, 255, 255);
  doc.text("GestorObras", mx, 16);
  doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(148, 163, 184);
  doc.text("Relatório Semanal - " + dateStr, mx, 24);
  doc.text("E-REDES | Oliveira de Azemeis", mx, 30);
  cy = 44;

  // KPIs
  const a = obras.filter(o => !o.arquivada);
  const active = a.filter(o => !o.concluida);
  const done = a.filter(o => o.concluida);
  const alerts = getAlerts(obras);
  const totalTarefas = active.reduce((s, o) => s + (o.tarefas || []).filter(t => !t.concluida).length, 0);

  const kpis = [
    { n: active.length, l: "Ativas", color: [59, 130, 246] },
    { n: done.length, l: "Concluídas", color: [22, 163, 74] },
    { n: alerts.length, l: "Alertas", color: [220, 38, 38] },
    { n: totalTarefas, l: "Tarefas Pend.", color: [245, 158, 11] }
  ];
  const kw = (cw - 9) / 4;
  kpis.forEach((k, i) => {
    const kx = mx + i * (kw + 3);
    doc.setFillColor(241, 245, 249); doc.roundedRect(kx, cy, kw, 22, 3, 3, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(20); doc.setTextColor(...k.color);
    doc.text(String(k.n), kx + kw / 2, cy + 13, { align: "center" });
    doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.setTextColor(100, 116, 139);
    doc.text(k.l, kx + kw / 2, cy + 19, { align: "center" });
  });
  cy += 30;

  // Category breakdown
  doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(15, 23, 42);
  doc.text("Progresso por Categoria", mx, cy); cy += 6;
  TIPOS.forEach(t => {
    const m = TM[t];
    const ta = a.filter(o => o.tipo === t);
    const ac = ta.filter(o => !o.concluida).length;
    const dn = ta.filter(o => o.concluida).length;
    const tot = ta.length;
    const pct = tot > 0 ? Math.round((dn / tot) * 100) : 0;
    const colors = { RP: [30, 58, 95], OCR: [120, 53, 15], PLR: [20, 83, 45] };
    doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...(colors[t] || [0, 0, 0]));
    doc.text(t + " - " + m.label, mx, cy);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(100, 116, 139);
    doc.text(ac + " ativas / " + dn + " concluídas / " + tot + " total (" + pct + "%)", mx + 50, cy);
    // Progress bar
    const bx = mx, by = cy + 2, bw2 = cw, bh = 3;
    doc.setFillColor(226, 232, 240); doc.roundedRect(bx, by, bw2, bh, 1, 1, "F");
    if (pct > 0) { doc.setFillColor(...(colors[t] || [0, 0, 0])); doc.roundedRect(bx, by, bw2 * pct / 100, bh, 1, 1, "F"); }
    cy += 10;
  });
  cy += 4;

  // Alerts
  if (alerts.length > 0) {
    drawLine(cy - 2); cy += 2;
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(220, 38, 38);
    doc.text("ALERTAS (" + alerts.length + ")", mx, cy); cy += 6;
    alerts.slice(0, 12).forEach(al => {
      checkPage(6);
      doc.setFont("helvetica", "bold"); doc.setFontSize(8); doc.setTextColor(15, 23, 42);
      doc.text((al.obra.numero || "-"), mx + 2, cy);

      doc.text(al.msg + " | " + (al.obra.concelho || "") + " | " + al.obra.tipo, mx + 35, cy);
      cy += 5;
    });
    cy += 4;
  }

  // Next 7 days
  drawLine(cy - 2); cy += 2;
  doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(15, 23, 42);
  doc.text("PROXIMOS 7 DIAS", mx, cy); cy += 6;
  let hasEvents = false;
  for (let i = 0; i < 7; i++) {
    const d = new Date(today); d.setDate(d.getDate() + i); d.setHours(0, 0, 0, 0);
    const key = toKey(d);
    const dn2 = i === 0 ? "Hoje" : i === 1 ? "Amanhã" : WD[d.getDay()];
    const de = (events || []).filter(e => e.data === key).sort((x, y) => (x.hora || "").localeCompare(y.hora || ""));
    const co = active.filter(o => o.corteMarcado && o.dataCorte === key);
    if (de.length > 0 || co.length > 0) {
      hasEvents = true;
      checkPage(8);
      doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(245, 158, 11);
      doc.text(dn2 + " (" + fmtD(key) + ")", mx + 2, cy); cy += 4;
      co.forEach(c => {
        doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(234, 88, 12);
        doc.text("  [CORTE] " + (c.numero || "-"), mx + 4, cy); cy += 4;
      });
      de.forEach(e => {
        doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(51, 65, 85);
        doc.text("  " + (e.hora ? e.hora + " " : "- ") + e.texto, mx + 4, cy); cy += 4;
      });
      cy += 2;
    }
  }
  if (!hasEvents) {
    doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(148, 163, 184);
    doc.text("Semana limpa - sem eventos agendados", mx + 2, cy); cy += 6;
  }

  // Obras list per category
  TIPOS.forEach(t => {
    const list = a.filter(o => o.tipo === t && !o.concluida);
    if (list.length === 0) return;
    checkPage(16);
    drawLine(cy); cy += 4;
    const m = TM[t];
    const colors = { RP: [30, 58, 95], OCR: [120, 53, 15], PLR: [20, 83, 45] };
    doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(...(colors[t] || [0, 0, 0]));
    doc.text(t + " - Obras Ativas (" + list.length + ")", mx, cy); cy += 5;
    // Table header
    doc.setFillColor(241, 245, 249); doc.rect(mx, cy - 1, cw, 5, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(7); doc.setTextColor(100, 116, 139);
    doc.text("Número", mx + 2, cy + 2.5);
    doc.text("Designação", mx + 30, cy + 2.5);
    doc.text("Concelho", mx + 100, cy + 2.5);
    doc.text("Tags", mx + 130, cy + 2.5);
    doc.text("Tarefas", mx + 162, cy + 2.5);
    cy += 6;
    list.forEach(o => {
      checkPage(6);
      const tP2 = (o.tarefas || []).filter(t2 => !t2.concluida).length;
      const tT2 = (o.tarefas || []).length;
      doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.setTextColor(15, 23, 42);
      doc.text((o.numero || "-").slice(0, 18), mx + 2, cy);
      doc.setTextColor(71, 85, 105);
      doc.text((o.designacao || "-").slice(0, 45), mx + 30, cy);
      doc.text((o.concelho || "-").slice(0, 18), mx + 100, cy);
      doc.setTextColor(148, 163, 184);
      doc.text((o.tags || []).slice(0, 3).join(", ").slice(0, 20), mx + 130, cy);
      doc.text(tT2 > 0 ? (tT2 - tP2) + "/" + tT2 : "-", mx + 165, cy);
      cy += 4.5;
    });
    cy += 4;
  });

  // Pending todos
  const pendingTodos = (todos || []).filter(t => !t.concluida);
  if (pendingTodos.length > 0) {
    checkPage(14);
    drawLine(cy); cy += 4;
    doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(15, 23, 42);
    doc.text("TAREFAS GERAIS PENDENTES (" + pendingTodos.length + ")", mx, cy); cy += 5;
    pendingTodos.slice(0, 15).forEach(t => {
      checkPage(5);
      doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(51, 65, 85);
      doc.text("[ ] " + t.texto.slice(0, 80), mx + 2, cy); cy += 4;
    });
  }

  // Footer on each page
  const totalPages = doc.internal.getNumberOfPages();
  for (let p = 1; p <= totalPages; p++) {
    doc.setPage(p);
    doc.setDrawColor(245, 158, 11); doc.setLineWidth(0.5); doc.line(mx, ph - 10, pw - mx, ph - 10);
    doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.setTextColor(148, 163, 184);
    doc.text("GestorObras | Relatorio gerado a " + dateStr, mx, ph - 6);
    doc.text("Página " + p + " de " + totalPages, pw - mx, ph - 6, { align: "right" });
  }

  doc.save("GestorObras_Relatorio_" + toKey(today) + ".pdf");
}

/* ── Notifications System ── */
function useNotifications(obras, events) {
  const [notifEnabled, setNotifEnabled] = useState(false);
  const [notifSettings, setNotifSettings] = useState(() => {
    try { const s = localStorage.getItem("go-notif-settings"); return s ? JSON.parse(s) : { alerts: true, events: true, cortes: true, checkInterval: 30 }; }
    catch(e) { return { alerts: true, events: true, cortes: true, checkInterval: 30 }; }
  });
  const lastNotifRef = useRef({});

  useEffect(() => {
    if ("Notification" in window && Notification.permission === "granted") setNotifEnabled(true);
  }, []);

  const requestPermission = useCallback(async () => {
    if (!("Notification" in window)) return false;
    const p = await Notification.requestPermission();
    const ok = p === "granted";
    setNotifEnabled(ok);
    return ok;
  }, []);

  const saveSettings = useCallback((s) => {
    setNotifSettings(s);
    try { localStorage.setItem("go-notif-settings", JSON.stringify(s)); } catch(e) {}
  }, []);

  const sendNotif = useCallback((id, title, body, tag) => {
    if (!notifEnabled) return;
    const now = Date.now();
    const last = lastNotifRef.current[id] || 0;
    if (now - last < 1800000) return; // 30 min cooldown per notification
    lastNotifRef.current[id] = now;
    try {
      new Notification(title, { body, icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>", tag: tag || id, silent: false });
    } catch(e) { console.warn("Notification failed:", e); }
  }, [notifEnabled]);

  // Periodic check
  useEffect(() => {
    if (!notifEnabled) return;
    const check = () => {
      const now = new Date();
      const todayKey = toKey(now);
      const tomorrowKey = toKey(new Date(now.getTime() + 86400000));

      // Check today's events
      if (notifSettings.events) {
        (events || []).filter(e => e.data === todayKey).forEach(e => {
          sendNotif("ev-" + e.id, "📅 Evento Hoje", (e.hora ? e.hora + " — " : "") + e.texto, "event");
        });
      }

      // Check cortes
      if (notifSettings.cortes) {
        (obras || []).filter(o => !o.arquivada && !o.concluida && o.corteMarcado).forEach(o => {
          if (o.dataCorte === todayKey) {
            sendNotif("corte-" + o.id, "🟠 Corte HOJE!", (o.numero || "—") + " — " + (o.designacao || ""), "corte");
          } else if (o.dataCorte === tomorrowKey) {
            sendNotif("corte-tmr-" + o.id, "⚠️ Corte Amanhã", (o.numero || "—") + " — " + (o.designacao || ""), "corte");
          }
        });
      }

      // Check alerts
      if (notifSettings.alerts) {
        const alerts = getAlerts(obras);
        const critical = alerts.filter(a => a.tipo === "corte" || a.dias > 20);
        if (critical.length > 0) {
          sendNotif("alerts-batch", "🔔 " + critical.length + " Alertas Críticos", critical.slice(0, 3).map(a => (a.obra.numero || "—") + ": " + a.msg).join(" | "), "alerts");
        }
      }
    };
    check();
    const interval = setInterval(check, (notifSettings.checkInterval || 30) * 60000);
    return () => clearInterval(interval);
  }, [notifEnabled, notifSettings, obras, events, sendNotif]);

  return { notifEnabled, notifSettings, requestPermission, saveSettings };
}

/* ── ANÁLISE EXCEL ── */
function parseExcelData(wb) {
  const ws = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(ws, {defval:""});
  return raw.map(row => {
    const processo = String(row["Nº de Processo de Origem"]||"").trim();
    const dp = String(row["Definição do Projeto"]||"").trim();
    const subordem = String(row["Subordem"]||"").trim();
    const designacao = String(row["Designação Subordem"]||"").trim();
    const dataBaseFim = row["Data Base Fim"]||"";
    const estadoSistema = String(row["Estado Sistema"]||"").trim();
    const estadoProgest = String(row["Estado Progest"]||"").trim();
    const estadoOT = String(row["Estado Ordem de Trabalho"]||"").trim();
    const pse = String(row["PSE"]||"").trim();
    const concelho = String(row["Concelho"]||"").trim();
    const tecnico = String(row["Técnico AO"]||"").trim();
    const adjudicacao = String(row["Adjudicação"]||"").trim();
    const ultimaAtualizacao = row["Última Atualização Ordem"]||"";
    const planeadoMO = parseFloat(row["Planeado MO €"])||0;
    const planeadoMat = parseFloat(row["Planeado Mat. €"])||0;
    const realizadoMO = parseFloat(row["Realizado MO €"])||0;
    const realizadoMat = parseFloat(row["Realizado Mat. €"])||0;
    const lat = row["Latitude"]||"";
    const lng = row["Longitude"]||"";
    const estOpExec = String(row["Estado Operacional Execução"]||"").trim();
    const diasEstOpExec = parseInt(row["Dias Est. Op. Execução"])||0;
    const estOpLic = String(row["Estado Operacional Aut. e Lic."]||"").trim();
    const diasEstOpLic = parseInt(row["Dias Est. Op. Aut. e Lic."])||0;
    const nOTs = parseInt(row["Nº OTs Associadas"])||0;
    const tipoProcesso = String(row["Tipo de Processo"]||"").trim();
    const dataCompromisso = row["Data Compromisso"]||"";
    return {processo,dp,subordem,designacao,dataBaseFim,estadoSistema,estadoProgest,estadoOT,pse,concelho,tecnico,adjudicacao,ultimaAtualizacao,planeadoMO,planeadoMat,realizadoMO,realizadoMat,lat,lng,estOpExec,diasEstOpExec,estOpLic,diasEstOpLic,nOTs,tipoProcesso,dataCompromisso};
  });
}

function compareData(current, previous) {
  const changes = {novos:[],removidos:[],estadoMudou:[],otParadas:[],resumo:{}};
  const prevMap = {};
  (previous||[]).forEach(r => { prevMap[r.subordem] = r; });
  const currMap = {};
  current.forEach(r => { currMap[r.subordem] = r; });

  // Novos
  current.forEach(r => { if (!prevMap[r.subordem]) changes.novos.push(r); });
  // Removidos
  (previous||[]).forEach(r => { if (!currMap[r.subordem]) changes.removidos.push(r); });
  // Mudanças de estado
  current.forEach(r => {
    const prev = prevMap[r.subordem];
    if (prev) {
      const mudancas = [];
      if (prev.estadoOT !== r.estadoOT) mudancas.push({campo:"Estado OT",de:prev.estadoOT,para:r.estadoOT});
      if (prev.estadoProgest !== r.estadoProgest) mudancas.push({campo:"Estado Progest",de:prev.estadoProgest,para:r.estadoProgest});
      if (prev.estOpExec !== r.estOpExec && (prev.estOpExec||r.estOpExec)) mudancas.push({campo:"Estado Op. Execução",de:prev.estOpExec||"(vazio)",para:r.estOpExec||"(vazio)"});
      if (prev.adjudicacao !== r.adjudicacao) mudancas.push({campo:"Adjudicação",de:prev.adjudicacao,para:r.adjudicacao});
      if (mudancas.length > 0) changes.estadoMudou.push({row:r,mudancas});
    }
  });

  // OTs paradas (estado Pendente há muitos dias sem atualização)
  const hoje = new Date();
  current.forEach(r => {
    if (r.estadoOT === "Pendente" && r.ultimaAtualizacao) {
      let lastUpdate;
      if (typeof r.ultimaAtualizacao === "string" && r.ultimaAtualizacao.includes("-")) {
        lastUpdate = new Date(r.ultimaAtualizacao);
      } else if (typeof r.ultimaAtualizacao === "number") {
        lastUpdate = new Date((r.ultimaAtualizacao - 25569) * 86400000);
      } else {
        lastUpdate = new Date(r.ultimaAtualizacao);
      }
      if (!isNaN(lastUpdate.getTime())) {
        const dias = Math.floor((hoje - lastUpdate) / 86400000);
        if (dias >= 5) changes.otParadas.push({...r, diasParada: dias});
      }
    }
  });
  changes.otParadas.sort((a,b) => b.diasParada - a.diasParada);

  // Resumo
  const estadosOT = {};
  const estadosProgest = {};
  const concelhos = {};
  current.forEach(r => {
    estadosOT[r.estadoOT] = (estadosOT[r.estadoOT]||0) + 1;
    if (r.estadoProgest) estadosProgest[r.estadoProgest] = (estadosProgest[r.estadoProgest]||0) + 1;
    if (r.concelho) concelhos[r.concelho] = (concelhos[r.concelho]||0) + 1;
  });
  changes.resumo = {total:current.length, estadosOT, estadosProgest, concelhos};
  return changes;
}

const EXCEL_COLS=["Nº de Processo de Origem","Tipo de Processo","Definição do Projeto","Subordem","Designação Subordem","Data Base Fim","Data Fim Programada (OT)","Data Compromisso","Estado Sistema","Estado Progest","Estado Ordem de Trabalho","Concelho","Adjudicação","Data fim programada (processo)","Última Atualização Ordem","Estado Operacional Execução","Dias Est. Op. Execução","Observações Execução","Estado Operacional Aut. e Lic.","Dias Est. Op. Aut. e Lic.","Observações AUT. E LIC."];

function parseExcel(file){
  return new Promise((res,rej)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{try{const wb=XLSX.read(e.target.result,{type:"array",cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];const data=XLSX.utils.sheet_to_json(ws,{defval:""});res(data);}catch(err){rej(err);}};
    reader.onerror=rej;reader.readAsArrayBuffer(file);
  });
}

function slimRow(r){
  const keys=Object.keys(r);
  const find=(terms)=>keys.find(k=>{const kl=k.toLowerCase();return terms.some(t=>kl.includes(t.toLowerCase()));});
  return {
    proc:String(r[find(["Processo de Origem","processo"])]||""),
    tipo:String(r[find(["Tipo de Processo","Tipo Processo"])]||""),
    dp:String(r[find(["Defini"])]||""),
    ot:String(r[find(["Subordem"])]||""),
    dsg:String(r[find(["Designa"])]||""),
    dbf:String(r[find(["Data Base Fim"])]||""),
    dfot:String(r[find(["Data Fim Programada (OT)","Fim Programada (OT)"])]||""),
    dc:String(r[find(["Data Compromisso"])]||""),
    es:String(r[find(["Estado Sistema"])]||""),
    ep:String(r[find(["Estado Progest"])]||""),
    eot:String(r[find(["Estado Ordem de Trabalho","Estado Ordem"])]||""),
    conc:String(r[find(["Concelho"])]||""),
    adj:String(r[find(["Adjudica"])]||""),
    dfp:String(r[find(["Data fim programada (processo)","fim programada (processo)"])]||""),
    ua:String(r[find(["ltima Atualiza"])]||""),
    eoe:String(r[find(["Estado Operacional Exec"])]||""),
    doe:String(r[find(["Dias Est. Op. Exec","Dias Est. Op. Execu"])]||""),
    obe:String(r[find(["Observa","Execu"])]||""),
    eoal:String(r[find(["Estado Operacional Aut","Aut. e Lic"])]||""),
    doal:String(r[find(["Dias Est. Op. Aut"])]||""),
    obal:String(r[find(["Observa","AUT. E LIC","LIC."])]||"")
  };
}

function excelSave(key,data){try{localStorage.setItem("excel_"+key,JSON.stringify(data));}catch(e){console.warn("Excel save failed",e);}}
function excelLoad(key){try{const d=localStorage.getItem("excel_"+key);return d?JSON.parse(d):null;}catch(e){return null;}}

function ExcelAnalise({onBack,historico,onUpdateHistorico,onUpdateMeta}){
  const [loading,setLoading]=useState(false);
  const [result,setResult]=useState(null);
  const [tab,setTab]=useState("resumo");
  const [search,setSearch]=useState("");
  const [searchResults,setSearchResults]=useState([]);
  const [rows,setRows]=useState(null);
  const [meta,setMeta]=useState(null);
  const fileRef=useRef(null);

  useEffect(()=>{
    const saved=excelLoad("rows");
    const savedMeta=excelLoad("meta");
    if(saved&&saved.length>0){
      setRows(saved);
      setMeta(savedMeta);
      setResult(doAnalyze(saved,null));
    }
  },[]);

  const doAnalyze=(data,prev)=>{
    const r={totais:{},estados:{},estadosOT:{},estadosEOT:{},concelhos:{},novas:[],removidas:[],mudancas:[],alertas:[]};
    r.totais.total=data.length;
    r.totais.processos=new Set(data.map(x=>x.proc).filter(Boolean)).size;
    r.totais.dps=new Set(data.map(x=>x.dp).filter(Boolean)).size;
    data.forEach(x=>{const e=x.ep||"Sem estado";r.estados[e]=(r.estados[e]||0)+1;});
    data.forEach(x=>{const e=x.eoe||"Sem estado";r.estadosOT[e]=(r.estadosOT[e]||0)+1;});
    data.forEach(x=>{const e=x.eot||"Sem estado";r.estadosEOT[e]=(r.estadosEOT[e]||0)+1;});
    data.forEach(x=>{const c=x.conc||"Sem concelho";r.concelhos[c]=(r.concelhos[c]||0)+1;});
    const hoje=new Date();
    data.forEach(x=>{
      // Alerta: OT sem atualização há mais de 5 dias
      if(x.ua){const d=new Date(x.ua);const dias=Math.floor((hoje-d)/86400000);
        if(dias>5&&x.eot&&x.eot.toLowerCase()!=="fechada"){
          r.alertas.push({tipo:"parada",proc:x.proc,dp:x.dp,dsg:x.dsg,dias,ep:x.ep,conc:x.conc,eoe:x.eoe,eot:x.eot,doe:x.doe});
        }}
      // Alerta: prazo ultrapassado
      const prazo=x.dc||x.dfp||x.dbf;
      if(prazo){const dp=new Date(prazo);const diasP=Math.floor((hoje-dp)/86400000);
        if(diasP>0&&x.eot&&x.eot.toLowerCase()!=="fechada"){
          r.alertas.push({tipo:"prazo",proc:x.proc,dp:x.dp,dsg:x.dsg,dias:diasP,ep:x.ep,conc:x.conc,eoe:x.eoe,eot:x.eot,prazo:prazo});
        }else if(diasP>-10&&diasP<=0&&x.eot&&x.eot.toLowerCase()!=="fechada"){
          r.alertas.push({tipo:"prazo_proximo",proc:x.proc,dp:x.dp,dsg:x.dsg,dias:Math.abs(diasP),ep:x.ep,conc:x.conc,eoe:x.eoe,eot:x.eot,prazo:prazo});
        }}
      // Alerta: licenciamento parado
      if(x.doal&&parseInt(x.doal)>15&&x.eoal){
        r.alertas.push({tipo:"licenca",proc:x.proc,dp:x.dp,dsg:x.dsg,dias:parseInt(x.doal),ep:x.ep,conc:x.conc,eoal:x.eoal,obal:x.obal});
      }
    });
    r.alertas.sort((a,b)=>{const ord={prazo:0,prazo_proximo:1,parada:2,licenca:3};return(ord[a.tipo]||9)-(ord[b.tipo]||9)||b.dias-a.dias;});
    if(prev&&prev.length>0){
      const pMap=new Map();prev.forEach(x=>pMap.set(x.proc+"_"+x.dp+"_"+x.ot,x));
      const cMap=new Map();data.forEach(x=>cMap.set(x.proc+"_"+x.dp+"_"+x.ot,x));
      data.forEach(x=>{const k=x.proc+"_"+x.dp+"_"+x.ot;if(!pMap.has(k))r.novas.push(x);});
      prev.forEach(x=>{const k=x.proc+"_"+x.dp+"_"+x.ot;if(!cMap.has(k))r.removidas.push(x);});
      data.forEach(x=>{const k=x.proc+"_"+x.dp+"_"+x.ot;const p=pMap.get(k);if(p){
        if(p.ep&&x.ep&&p.ep!==x.ep)r.mudancas.push({tipo:"progest",proc:x.proc,dp:x.dp,dsg:x.dsg,de:p.ep,para:x.ep});
        if(p.eoe&&x.eoe&&p.eoe!==x.eoe)r.mudancas.push({tipo:"operacional",proc:x.proc,dp:x.dp,dsg:x.dsg,de:p.eoe,para:x.eoe});
        if(p.eot&&x.eot&&p.eot!==x.eot)r.mudancas.push({tipo:"ordem",proc:x.proc,dp:x.dp,dsg:x.dsg,de:p.eot,para:x.eot});
      }});
    }
    return r;
  };

  const handleFile=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    setLoading(true);
    try{
      const raw=await parseExcel(file);
      const slim=raw.map(slimRow);
      const prev=rows;
      const analysis=doAnalyze(slim,prev);
      excelSave("rows",slim);
      const newMeta={d:new Date().toISOString(),f:file.name,total:slim.length};
      excelSave("meta",newMeta);
      setRows(slim);setMeta(newMeta);setResult(analysis);setTab("resumo");
      onUpdateMeta(newMeta);
      const entry={data:new Date().toISOString(),ficheiro:file.name,total:slim.length,novas:analysis.novas.length,removidas:analysis.removidas.length,mudancas:analysis.mudancas.length,alertas:analysis.alertas.length};
      onUpdateHistorico([entry,...(historico||[]).slice(0,29)]);
    }catch(err){alert("Erro: "+err.message);}
    setLoading(false);
    if(fileRef.current)fileRef.current.value="";
  };

  const doSearch=(q)=>{
    setSearch(q);
    if(!q.trim()||!rows){setSearchResults([]);return;}
    const s=q.trim().toLowerCase();
    setSearchResults(rows.filter(r=>Object.values(r).some(v=>v&&v.toLowerCase().includes(s))));
  };

  const TB=(k,label,icon,count)=>{const a=tab===k;return(<button key={k} onClick={()=>setTab(k)} style={{padding:"6px 10px",borderRadius:6,border:"1px solid "+(a?"#10b981":"#334155"),background:a?"#10b98120":"transparent",color:a?"#10b981":"#94a3b8",fontSize:10,fontWeight:a?700:400,cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>{icon} {label}{count!==undefined&&<span style={{background:count>0?"#475569":"#334155",color:count>0?"#fff":"#64748b",padding:"0 5px",borderRadius:8,fontSize:9,fontWeight:700}}>{count}</span>}</button>);};

  const Card=({r,i})=>{
    const isPLR=r.proc.startsWith("9")||r.proc.startsWith("8");
    const ac=isPLR?"#16a34a":"#3b82f6";
    const diasAtt=r.ua?Math.floor((new Date()-new Date(r.ua))/86400000):null;
    const prazo=r.dc||r.dfp||r.dbf;
    const diasPrazo=prazo?Math.floor((new Date()-new Date(prazo))/86400000):null;
    return(<WBox key={i} style={{padding:12,borderLeft:"3px solid "+ac,marginBottom:6}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontSize:11}}>{isPLR?"⚡":"🏗️"}</span>
          <span style={{fontSize:12,fontWeight:700,color:"#fff",fontFamily:"monospace"}}>{r.proc}</span>
          <span style={{fontSize:9,background:ac+"20",color:ac,padding:"1px 5px",borderRadius:3,fontWeight:600}}>{isPLR?"PLR":"RP"}</span>
          {r.tipo&&<span style={{fontSize:9,background:"#47556920",color:"#94a3b8",padding:"1px 5px",borderRadius:3}}>{r.tipo}</span>}
        </div>
        {diasAtt>0&&diasAtt<9999&&<span style={{fontSize:9,color:diasAtt>10?"#f59e0b":"#64748b"}}>att: {diasAtt}d</span>}
      </div>
      <div style={{fontSize:11,color:"#e2e8f0",marginBottom:4}}>{r.dsg||"—"}</div>
      {r.eot&&<div style={{display:"flex",gap:6,marginBottom:4}}>
        <span style={{fontSize:9,padding:"2px 6px",borderRadius:4,fontWeight:600,background:r.eot==="Pendente"?"#f59e0b20":r.eot==="Suspensa"?"#dc262620":r.eot==="Fechada"?"#64748b20":"#3b82f620",color:r.eot==="Pendente"?"#f59e0b":r.eot==="Suspensa"?"#dc2626":r.eot==="Fechada"?"#64748b":"#3b82f6"}}>OT: {r.eot}</span>
        {diasPrazo!==null&&<span style={{fontSize:9,padding:"2px 6px",borderRadius:4,fontWeight:600,background:diasPrazo>0?"#dc262620":"#10b98120",color:diasPrazo>0?"#dc2626":"#10b981"}}>{diasPrazo>0?"⚠️ "+diasPrazo+"d atrasada":"✅ "+Math.abs(diasPrazo)+"d até prazo"}</span>}
      </div>}
      {r.eoe&&<div style={{background:"#f59e0b15",border:"1px solid #f59e0b30",borderRadius:5,padding:"4px 8px",marginBottom:5,display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:10,fontWeight:600,color:"#f59e0b"}}>⚙️ {r.eoe}</span>{r.doe&&r.doe!=="0"&&<span style={{fontSize:9,color:"#f59e0b"}}>({r.doe} dias)</span>}</div>}
      {r.eoal&&<div style={{background:"#8b5cf615",border:"1px solid #8b5cf630",borderRadius:5,padding:"4px 8px",marginBottom:5,display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:10,fontWeight:600,color:"#8b5cf6"}}>📋 {r.eoal}</span>{r.doal&&r.doal!=="0"&&<span style={{fontSize:9,color:"#8b5cf6"}}>({r.doal} dias)</span>}</div>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4,fontSize:10}}>
        <div><span style={{color:"#64748b"}}>DP: </span><span style={{color:"#f59e0b",fontFamily:"monospace"}}>{r.dp||"—"}</span></div>
        <div><span style={{color:"#64748b"}}>OT: </span><span style={{color:"#94a3b8",fontFamily:"monospace"}}>{r.ot||"—"}</span></div>
        <div><span style={{color:"#64748b"}}>Estado: </span><span style={{color:"#e2e8f0"}}>{r.ep||"—"}</span></div>
        <div><span style={{color:"#64748b"}}>📍 </span><span style={{color:"#94a3b8"}}>{r.conc||"—"}</span></div>
        <div><span style={{color:"#64748b"}}>Adjudicação: </span><span style={{color:"#94a3b8"}}>{r.adj||"—"}</span></div>
        <div><span style={{color:"#64748b"}}>Data Comp.: </span><span style={{color:"#94a3b8"}}>{r.dc?fmtD(r.dc):"—"}</span></div>
        <div><span style={{color:"#64748b"}}>Data Fim Base: </span><span style={{color:"#94a3b8"}}>{r.dbf?fmtD(r.dbf):"—"}</span></div>
        <div><span style={{color:"#64748b"}}>Fim Prog.: </span><span style={{color:"#94a3b8"}}>{r.dfp?fmtD(r.dfp):"—"}</span></div>
      </div>
      {(r.obe||r.obal)&&(<div style={{marginTop:5,borderTop:"1px solid #334155",paddingTop:4,fontSize:9,color:"#64748b"}}>
        {r.obe&&<div>📝 Exec: {r.obe}</div>}
        {r.obal&&<div>📝 Lic: {r.obal}</div>}
      </div>)}
    </WBox>);
  };

  return(
    <div style={{minHeight:"100vh",background:"#0f172a"}}>
      <div style={{background:"linear-gradient(135deg,#065f46,#10b981)",padding:"14px 24px 18px"}}>
        <BackBtn onClick={onBack} label="Início"/>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:3}}>
          <div style={{display:"flex",alignItems:"center",gap:7}}><span style={{fontSize:20}}>📊</span><h1 style={{fontSize:17,fontWeight:800,color:"#fff",margin:0}}>Análise Excel</h1></div>
          <button onClick={()=>fileRef.current&&fileRef.current.click()} disabled={loading} style={{padding:"6px 12px",borderRadius:5,border:"none",background:"rgba(255,255,255,.18)",color:"#fff",fontWeight:700,fontSize:11,cursor:loading?"wait":"pointer"}}>{loading?"A analisar...":"📂 Carregar Excel"}</button>
        </div>
        {meta&&<div style={{fontSize:11,color:"rgba(255,255,255,.5)",marginTop:4}}>Último: {meta.f} ({fmtD(meta.d)}) · {meta.total} registos</div>}
        <input ref={fileRef} type="file" accept=".xlsx,.xls" onChange={handleFile} style={{display:"none"}}/>
      </div>
      <div style={{padding:"12px 20px 28px"}}>
        {!result&&(<div style={{textAlign:"center",padding:"50px 16px",color:"#64748b"}}><div style={{fontSize:48,marginBottom:12}}>📊</div><div style={{fontSize:14,fontWeight:600,color:"#94a3b8"}}>Carrega o teu Excel diário</div><div style={{fontSize:11,marginTop:6,color:"#475569",maxWidth:280,margin:"6px auto 0"}}>Seleciona o ficheiro CP_ListaExecução.</div>
          <button onClick={()=>fileRef.current&&fileRef.current.click()} style={{marginTop:16,padding:"10px 24px",borderRadius:8,border:"2px solid #10b981",background:"transparent",color:"#10b981",fontSize:12,fontWeight:700,cursor:"pointer"}}>📂 Selecionar ficheiro</button>
        </div>)}

        {result&&(<div>
          <div style={{marginBottom:10}}><div style={{display:"flex",gap:6}}>
            <input style={{flex:1,padding:"8px 10px",borderRadius:6,border:"1px solid #334155",background:"#1e293b",color:"#e2e8f0",fontSize:12,outline:"none"}} placeholder="🔍 Pesquisar PLR, RP, DP, concelho..." value={search} onChange={e=>{doSearch(e.target.value);if(e.target.value.trim())setTab("pesquisa");}}/>
            {search&&<button onClick={()=>{setSearch("");setSearchResults([]);setTab("resumo");}} style={{padding:"6px 10px",borderRadius:6,border:"1px solid #334155",background:"#1e293b",color:"#94a3b8",fontSize:11,cursor:"pointer"}}>✕</button>}
          </div></div>

          <div style={{display:"flex",gap:4,marginBottom:12,flexWrap:"wrap"}}>
            {TB("resumo","Resumo","📋")}{TB("mudancas","Alterações","🔄",result.mudancas.length)}{TB("novas","Novas","🆕",result.novas.length)}{TB("alertas","Alertas","⚠️",result.alertas.length)}{TB("pesquisa","Pesquisa","🔍",search?searchResults.length:undefined)}{TB("historico","Histórico","📅")}
          </div>

          {tab==="resumo"&&(<div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12}}>
              {[{n:result.totais.total,l:"Registos",c:"#3b82f6"},{n:result.totais.processos,l:"Processos",c:"#8b5cf6"},{n:result.totais.dps,l:"DPs",c:"#f59e0b"},{n:result.novas.length,l:"Novas",c:"#10b981"},{n:result.mudancas.length,l:"Alterações",c:"#f97316"},{n:result.alertas.length,l:"Alertas",c:result.alertas.length>0?"#dc2626":"#64748b"}].map((k,i)=>(
                <div key={i} style={{background:"#1e293b",borderRadius:8,padding:"10px",border:"1px solid #334155",textAlign:"center"}}>
                  <div style={{fontSize:22,fontWeight:800,color:k.c}}>{k.n}</div>
                  <div style={{fontSize:9,color:"#64748b",marginTop:1}}>{k.l}</div>
                </div>))}
            </div>
            <WBox style={{marginBottom:10}}><WTitle icon="📊" text="Estados Progest"/><div style={{display:"flex",flexDirection:"column",gap:3}}>
              {Object.entries(result.estados).sort((a,b)=>b[1]-a[1]).map(([e,c])=>(<div key={e} style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{flex:1,fontSize:11,color:"#e2e8f0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e}</div>
                <div style={{width:80,height:6,borderRadius:3,background:"#334155",flexShrink:0}}><div style={{height:6,borderRadius:3,background:"#10b981",width:Math.round(c/result.totais.total*100)+"%"}}/></div>
                <div style={{fontSize:11,fontWeight:700,color:"#10b981",minWidth:24,textAlign:"right"}}>{c}</div>
              </div>))}
            </div></WBox>
            <WBox style={{marginBottom:10}}><WTitle icon="⚙️" text="Estado Operacional Execução"/><div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {Object.entries(result.estadosOT).sort((a,b)=>b[1]-a[1]).map(([e,n])=>(<div key={e} style={{background:"#0f172a",padding:"6px 10px",borderRadius:6,border:"1px solid #334155"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#fff"}}>{n}</div><div style={{fontSize:9,color:"#64748b"}}>{e}</div>
              </div>))}
            </div></WBox>
            <WBox style={{marginBottom:10}}><WTitle icon="🔧" text="Estado Ordem de Trabalho"/><div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {Object.entries(result.estadosEOT).sort((a,b)=>b[1]-a[1]).map(([e,n])=>{const colors={"Pendente":"#f59e0b","Agendada":"#3b82f6","No Local":"#10b981","Suspensa":"#dc2626","Fechada":"#64748b"};return(<div key={e} style={{background:(colors[e]||"#64748b")+"15",padding:"6px 10px",borderRadius:6,border:"1px solid "+(colors[e]||"#64748b")+"30"}}>
                <div style={{fontSize:14,fontWeight:800,color:colors[e]||"#94a3b8"}}>{n}</div><div style={{fontSize:9,color:colors[e]||"#64748b"}}>{e}</div>
              </div>);})}
            </div></WBox>
            <WBox><WTitle icon="📍" text="Por Concelho"/><div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {Object.entries(result.concelhos).sort((a,b)=>b[1]-a[1]).map(([c,n])=>(<div key={c} style={{background:"#0f172a",padding:"6px 10px",borderRadius:6,border:"1px solid #334155"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#fff"}}>{n}</div><div style={{fontSize:9,color:"#64748b"}}>{c}</div>
              </div>))}
            </div></WBox>
          </div>)}

          {tab==="mudancas"&&(<div>
            {result.mudancas.length===0?(<WBox><div style={{textAlign:"center",padding:16,color:"#64748b"}}>✅ Sem alterações de estado</div></WBox>):(
              result.mudancas.map((m,i)=>(<WBox key={i} style={{padding:10,marginBottom:6}}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                  <span style={{fontSize:11}}>{m.tipo==="progest"?"📊":"⚙️"}</span>
                  <span style={{fontSize:11,fontWeight:700,color:"#fff",fontFamily:"monospace"}}>{m.proc}</span>
                  <span style={{fontSize:9,color:"#64748b"}}>{m.dp}</span>
                </div>
                <div style={{fontSize:10,color:"#94a3b8",marginBottom:3}}>{m.dsg}</div>
                <div style={{display:"flex",alignItems:"center",gap:6,fontSize:10}}>
                  <span style={{color:"#f87171",background:"#dc262615",padding:"2px 6px",borderRadius:4}}>{m.de}</span>
                  <span style={{color:"#64748b"}}>→</span>
                  <span style={{color:"#34d399",background:"#10b98115",padding:"2px 6px",borderRadius:4}}>{m.para}</span>
                </div>
              </WBox>))
            )}
          </div>)}

          {tab==="novas"&&(<div>
            {result.novas.length===0&&result.removidas.length===0?(<WBox><div style={{textAlign:"center",padding:16,color:"#64748b"}}>📋 Sem entradas novas ou removidas</div></WBox>):(
              <div>
                {result.novas.length>0&&<div style={{fontSize:12,fontWeight:700,color:"#10b981",marginBottom:6}}>🆕 Novas ({result.novas.length})</div>}
                {result.novas.map((r,i)=><Card key={"n"+i} r={r} i={i}/>)}
                {result.removidas.length>0&&<div style={{fontSize:12,fontWeight:700,color:"#dc2626",marginTop:12,marginBottom:6}}>🗑 Removidas ({result.removidas.length})</div>}
                {result.removidas.map((r,i)=><Card key={"r"+i} r={r} i={i}/>)}
              </div>
            )}
          </div>)}

          {tab==="alertas"&&(<div>
            {result.alertas.length===0?(<WBox><div style={{textAlign:"center",padding:16,color:"#64748b"}}>✅ Sem alertas</div></WBox>):(
              <div>
                {result.alertas.filter(a=>a.tipo==="prazo").length>0&&<div style={{fontSize:11,fontWeight:700,color:"#dc2626",marginBottom:6}}>🚨 Prazo ultrapassado ({result.alertas.filter(a=>a.tipo==="prazo").length})</div>}
                {result.alertas.filter(a=>a.tipo==="prazo").map((a,i)=>(<WBox key={"p"+i} style={{padding:10,marginBottom:6,borderLeft:"3px solid #dc2626"}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:3}}>
                    <span style={{fontSize:11,fontWeight:700,color:"#fff",fontFamily:"monospace"}}>{a.proc}</span>
                    <span style={{fontSize:10,fontWeight:700,color:"#dc2626",background:"#dc262615",padding:"2px 6px",borderRadius:4}}>🚨 {a.dias}d atrasada</span>
                  </div>
                  <div style={{fontSize:10,color:"#94a3b8"}}>{a.dsg}</div>
                  <div style={{display:"flex",gap:8,marginTop:3,fontSize:9,color:"#64748b",flexWrap:"wrap"}}><span>{a.dp}</span><span>📍 {a.conc}</span><span>OT: {a.eot}</span><span>Prazo: {fmtD(a.prazo)}</span></div>
                </WBox>))}

                {result.alertas.filter(a=>a.tipo==="prazo_proximo").length>0&&<div style={{fontSize:11,fontWeight:700,color:"#f59e0b",marginTop:10,marginBottom:6}}>⏰ Prazo próximo ({result.alertas.filter(a=>a.tipo==="prazo_proximo").length})</div>}
                {result.alertas.filter(a=>a.tipo==="prazo_proximo").map((a,i)=>(<WBox key={"pp"+i} style={{padding:10,marginBottom:6,borderLeft:"3px solid #f59e0b"}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:3}}>
                    <span style={{fontSize:11,fontWeight:700,color:"#fff",fontFamily:"monospace"}}>{a.proc}</span>
                    <span style={{fontSize:10,fontWeight:700,color:"#f59e0b",background:"#f59e0b15",padding:"2px 6px",borderRadius:4}}>⏰ {a.dias}d até prazo</span>
                  </div>
                  <div style={{fontSize:10,color:"#94a3b8"}}>{a.dsg}</div>
                  <div style={{display:"flex",gap:8,marginTop:3,fontSize:9,color:"#64748b",flexWrap:"wrap"}}><span>{a.dp}</span><span>📍 {a.conc}</span><span>OT: {a.eot}</span><span>Prazo: {fmtD(a.prazo)}</span></div>
                </WBox>))}

                {result.alertas.filter(a=>a.tipo==="parada").length>0&&<div style={{fontSize:11,fontWeight:700,color:"#f97316",marginTop:10,marginBottom:6}}>⚠️ OTs sem atualização há +5 dias ({result.alertas.filter(a=>a.tipo==="parada").length})</div>}
                {result.alertas.filter(a=>a.tipo==="parada").map((a,i)=>(<WBox key={"s"+i} style={{padding:10,marginBottom:6,borderLeft:"3px solid "+(a.dias>15?"#dc2626":"#f97316")}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:3}}>
                    <span style={{fontSize:11,fontWeight:700,color:"#fff",fontFamily:"monospace"}}>{a.proc}</span>
                    <span style={{fontSize:10,fontWeight:700,color:a.dias>15?"#dc2626":"#f97316",background:a.dias>15?"#dc262615":"#f9731615",padding:"2px 6px",borderRadius:4}}>⏰ {a.dias}d sem att</span>
                  </div>
                  <div style={{fontSize:10,color:"#94a3b8"}}>{a.dsg}</div>
                  <div style={{display:"flex",gap:8,marginTop:3,fontSize:9,color:"#64748b",flexWrap:"wrap"}}><span>{a.dp}</span><span>📍 {a.conc}</span><span>OT: {a.eot}</span>{a.eoe&&<span>⚙️ {a.eoe}</span>}</div>
                </WBox>))}

                {result.alertas.filter(a=>a.tipo==="licenca").length>0&&<div style={{fontSize:11,fontWeight:700,color:"#8b5cf6",marginTop:10,marginBottom:6}}>📋 Licenciamento parado há +15 dias ({result.alertas.filter(a=>a.tipo==="licenca").length})</div>}
                {result.alertas.filter(a=>a.tipo==="licenca").map((a,i)=>(<WBox key={"l"+i} style={{padding:10,marginBottom:6,borderLeft:"3px solid #8b5cf6"}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:3}}>
                    <span style={{fontSize:11,fontWeight:700,color:"#fff",fontFamily:"monospace"}}>{a.proc}</span>
                    <span style={{fontSize:10,fontWeight:700,color:"#8b5cf6",background:"#8b5cf615",padding:"2px 6px",borderRadius:4}}>📋 {a.dias}d</span>
                  </div>
                  <div style={{fontSize:10,color:"#94a3b8"}}>{a.dsg}</div>
                  <div style={{display:"flex",gap:8,marginTop:3,fontSize:9,color:"#64748b",flexWrap:"wrap"}}><span>{a.dp}</span><span>📍 {a.conc}</span><span>{a.eoal}</span></div>
                  {a.obal&&<div style={{fontSize:9,color:"#8b5cf6",marginTop:2}}>📝 {a.obal}</div>}
                </WBox>))}
              </div>
            )}
          </div>)}

          {tab==="pesquisa"&&(<div>
            {!search.trim()?(<WBox><div style={{textAlign:"center",padding:16,color:"#64748b"}}>🔍 Escreve um PLR, RP, DP ou concelho</div></WBox>):
            searchResults.length===0?(<WBox><div style={{textAlign:"center",padding:16,color:"#64748b"}}>🔍 Sem resultados para "{search}"</div></WBox>):(
              <div><div style={{fontSize:10,color:"#10b981",fontWeight:600,marginBottom:8}}>{searchResults.length} resultado{searchResults.length!==1?"s":""}</div>
                {searchResults.map((r,i)=><Card key={i} r={r} i={i}/>)}
              </div>
            )}
          </div>)}

          {tab==="historico"&&(<div>
            {(!historico||historico.length===0)?(<WBox><div style={{textAlign:"center",padding:16,color:"#64748b"}}>📅 Sem histórico</div></WBox>):(
              (historico||[]).map((h,i)=>(<WBox key={i} style={{padding:10,marginBottom:6}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{fontSize:11,fontWeight:700,color:"#fff"}}>{fmtD(h.data)}</span>
                  <span style={{fontSize:9,color:"#64748b"}}>{h.ficheiro}</span>
                </div>
                <div style={{display:"flex",gap:8,fontSize:10}}>
                  <span style={{color:"#3b82f6"}}>{h.total} registos</span>
                  {h.novas>0&&<span style={{color:"#10b981"}}>+{h.novas} novas</span>}
                  {h.removidas>0&&<span style={{color:"#dc2626"}}>-{h.removidas}</span>}
                  {h.mudancas>0&&<span style={{color:"#f59e0b"}}>{h.mudancas} alterações</span>}
                  {h.alertas>0&&<span style={{color:"#f97316"}}>{h.alertas} alertas</span>}
                </div>
              </WBox>))
            )}
          </div>)}
        </div>)}
      </div>
    </div>
  );
}

/* ── REUNIÕES ── */
function ReunioesLanding({folders,onBack,onSelect,onAdd,onDelete}) {
  const [newName,setNewName]=useState("");const [showAdd,setShowAdd]=useState(false);
  const doAdd=()=>{if(!newName.trim())return;onAdd(newName.trim());setNewName("");setShowAdd(false);};
  const totalReunioes=(folders||[]).reduce((s,f)=>(s+(f.reunioes||[]).length),0);
  return (
    <div style={{minHeight:"100vh",background:"#0f172a"}}>
      <div style={{background:"linear-gradient(135deg,#312e81,#6366f1)",padding:"14px 24px 18px"}}>
        <BackBtn onClick={onBack} label="Início"/>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:3}}>
          <div style={{display:"flex",alignItems:"center",gap:7}}><span style={{fontSize:20}}>📋</span><h1 style={{fontSize:17,fontWeight:800,color:"#fff",margin:0}}>Reuniões</h1></div>
          <button onClick={()=>setShowAdd(!showAdd)} style={{padding:"6px 12px",borderRadius:5,border:"none",background:"rgba(255,255,255,.18)",color:"#fff",fontWeight:700,fontSize:11,cursor:"pointer"}}>{showAdd?"×":"+ Pasta"}</button>
        </div>
        <div style={{fontSize:11,color:"rgba(255,255,255,.5)",marginTop:4}}>{(folders||[]).length} pastas · {totalReunioes} reuniões</div>
      </div>
      <div style={{padding:"12px 24px 28px"}}>
        {showAdd&&(<div style={{background:"#1e293b",borderRadius:8,padding:12,marginBottom:12,border:"1px solid #334155",display:"flex",gap:6}}>
          <input style={{flex:1,padding:"8px 10px",borderRadius:5,border:"1px solid #475569",background:"#0f172a",color:"#e2e8f0",fontSize:12,outline:"none"}} placeholder="Nome da pasta..." value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")doAdd();}} autoFocus/>
          <button onClick={doAdd} style={{padding:"6px 14px",borderRadius:5,border:"none",background:"#6366f1",color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer"}}>Criar</button>
        </div>)}
        {(folders||[]).length===0?(<div style={{textAlign:"center",padding:"40px 16px",color:"#64748b"}}><div style={{fontSize:32,marginBottom:8}}>📋</div><div style={{fontSize:12}}>Sem pastas de reuniões</div><div style={{fontSize:11,marginTop:4,color:"#475569"}}>Cria uma pasta para organizar as tuas reuniões</div></div>):(
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {folders.map(f=>{const count=(f.reunioes||[]).length;const last=count>0?(f.reunioes||[]).sort((a,b)=>new Date(b.data)-new Date(a.data))[0]:null;
              return (<div key={f.id} onClick={()=>onSelect(f)} style={{background:"#1e293b",borderRadius:10,padding:"14px 14px",border:"1px solid #334155",cursor:"pointer",display:"flex",alignItems:"center",gap:12,transition:"border-color .15s"}} onMouseEnter={e=>e.currentTarget.style.borderColor="#6366f1"} onMouseLeave={e=>e.currentTarget.style.borderColor="#334155"}>
                <div style={{width:38,height:38,borderRadius:8,background:"#6366f120",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>📁</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:700,color:"#fff"}}>{f.nome}</div>
                  <div style={{fontSize:10,color:"#64748b",marginTop:2}}>{count} {count===1?"reunião":"reuniões"}{last?" · última: "+fmtD(last.data):""}</div>
                </div>
                <button onClick={(e)=>{e.stopPropagation();if(confirm("Eliminar pasta '"+f.nome+"'?"))onDelete(f.id);}} style={{background:"none",border:"none",color:"#dc2626",cursor:"pointer",fontSize:12,opacity:.3,padding:4}}>🗑</button>
                <span style={{color:"#475569",fontSize:14}}>›</span>
              </div>);
            })}
          </div>
        )}
      </div>
    </div>
  );
}

function ReunioesFolder({folder,onBack,onSelect,onAdd,onRename,onDeleteFolder}) {
  const [showAdd,setShowAdd]=useState(false);const [titulo,setTitulo]=useState("");const [editing,setEditing]=useState(false);const [editName,setEditName]=useState(folder.nome);
  const doAdd=()=>{if(!titulo.trim())return;const r={id:uid(),titulo:titulo.trim(),data:new Date().toISOString().slice(0,10),participantes:"",notas:"",checklist:[],dataCriacao:new Date().toISOString()};onAdd(r);setTitulo("");setShowAdd(false);};
  const doRename=()=>{if(editName.trim()){onRename(editName.trim());}setEditing(false);};
  const reunioes=(folder.reunioes||[]).sort((a,b)=>new Date(b.data)-new Date(a.data));
  return (
    <div style={{minHeight:"100vh",background:"#0f172a"}}>
      <div style={{background:"linear-gradient(135deg,#312e81,#6366f1)",padding:"14px 24px 18px"}}>
        <BackBtn onClick={onBack} label="Reuniões"/>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:3}}>
          <div style={{display:"flex",alignItems:"center",gap:7}}>
            <span style={{fontSize:20}}>📁</span>
            {editing?(<div style={{display:"flex",gap:4}}><input style={{padding:"4px 8px",borderRadius:4,border:"1px solid rgba(255,255,255,.3)",background:"rgba(255,255,255,.1)",color:"#fff",fontSize:14,fontWeight:700,outline:"none",width:180}} value={editName} onChange={e=>setEditName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")doRename();if(e.key==="Escape")setEditing(false);}} autoFocus/><button onClick={doRename} style={{padding:"3px 8px",borderRadius:4,border:"none",background:"rgba(255,255,255,.2)",color:"#fff",fontSize:10,cursor:"pointer"}}>✓</button></div>):(<h1 onClick={()=>setEditing(true)} style={{fontSize:17,fontWeight:800,color:"#fff",margin:0,cursor:"pointer"}} title="Clica para renomear">{folder.nome}</h1>)}
          </div>
          <button onClick={()=>setShowAdd(!showAdd)} style={{padding:"6px 12px",borderRadius:5,border:"none",background:"rgba(255,255,255,.18)",color:"#fff",fontWeight:700,fontSize:11,cursor:"pointer"}}>{showAdd?"×":"+ Reunião"}</button>
        </div>
        <div style={{fontSize:11,color:"rgba(255,255,255,.5)",marginTop:4}}>{reunioes.length} {reunioes.length===1?"reunião":"reuniões"}</div>
      </div>
      <div style={{padding:"12px 24px 28px"}}>
        {showAdd&&(<div style={{background:"#1e293b",borderRadius:8,padding:12,marginBottom:12,border:"1px solid #334155",display:"flex",gap:6}}>
          <input style={{flex:1,padding:"8px 10px",borderRadius:5,border:"1px solid #475569",background:"#0f172a",color:"#e2e8f0",fontSize:12,outline:"none"}} placeholder="Título da reunião..." value={titulo} onChange={e=>setTitulo(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")doAdd();}} autoFocus/>
          <button onClick={doAdd} style={{padding:"6px 14px",borderRadius:5,border:"none",background:"#6366f1",color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer"}}>Criar</button>
        </div>)}
        {reunioes.length===0?(<div style={{textAlign:"center",padding:"40px 16px",color:"#64748b"}}><div style={{fontSize:32,marginBottom:8}}>📝</div><div style={{fontSize:12}}>Sem reuniões nesta pasta</div></div>):(
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {reunioes.map(r=>{const checkDone=(r.checklist||[]).filter(c=>c.concluida).length;const checkTotal=(r.checklist||[]).length;
              return (<div key={r.id} onClick={()=>onSelect(r)} style={{background:"#1e293b",borderRadius:8,padding:"12px 14px",border:"1px solid #334155",cursor:"pointer",display:"flex",alignItems:"center",gap:10,transition:"border-color .15s"}} onMouseEnter={e=>e.currentTarget.style.borderColor="#6366f1"} onMouseLeave={e=>e.currentTarget.style.borderColor="#334155"}>
                <div style={{width:34,height:34,borderRadius:7,background:"#6366f115",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,flexShrink:0}}>📝</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:700,color:"#fff"}}>{r.titulo}</div>
                  <div style={{display:"flex",gap:8,fontSize:10,color:"#64748b",marginTop:2}}>
                    <span>📅 {fmtD(r.data)}</span>
                    {r.participantes&&<span>👥 {r.participantes.slice(0,30)}{r.participantes.length>30?"...":""}</span>}
                    {checkTotal>0&&<span>✅ {checkDone}/{checkTotal}</span>}
                  </div>
                  {r.notas&&<div style={{fontSize:10,color:"#475569",marginTop:3,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{r.notas.slice(0,60)}{r.notas.length>60?"...":""}</div>}
                </div>
                <span style={{color:"#475569",fontSize:14}}>›</span>
              </div>);
            })}
          </div>
        )}
        <div style={{marginTop:16,textAlign:"center"}}><button onClick={()=>{if(confirm("Eliminar pasta '"+folder.nome+"' e todas as reuniões?"))onDeleteFolder();}} style={{background:"none",border:"none",color:"#dc2626",fontSize:10,cursor:"pointer",opacity:.5}}>🗑 Eliminar pasta</button></div>
      </div>
    </div>
  );
}

function ReuniaoDetailPage({reuniao:init,folder,onBack,onSave,onDelete}) {
  const [r,setR]=useState({...init});const [ed,setEd]=useState(false);const [dirty,setDirty]=useState(false);
  const [newCheck,setNewCheck]=useState("");
  const set=(k,v)=>{setR(p=>({...p,[k]:v}));setDirty(true);};
  const doSave=()=>{onSave(r);setDirty(false);setEd(false);};
  const addCheck=()=>{if(!newCheck.trim())return;set("checklist",[...(r.checklist||[]),{id:uid(),texto:newCheck.trim(),concluida:false}]);setNewCheck("");};
  const toggleCheck=(id)=>set("checklist",(r.checklist||[]).map(c=>c.id===id?{...c,concluida:!c.concluida}:c));
  const removeCheck=(id)=>set("checklist",(r.checklist||[]).filter(c=>c.id!==id));
  const pending=(r.checklist||[]).filter(c=>!c.concluida);
  const done=(r.checklist||[]).filter(c=>c.concluida);
  const fl={width:"100%",padding:"8px 10px",borderRadius:6,border:"1px solid "+(ed?"#e2e8f0":"#f1f5f9"),fontSize:12,outline:"none",fontFamily:"inherit",boxSizing:"border-box",background:ed?"#fff":"#f8fafc",color:"#334155"};
  const lb={fontSize:10,fontWeight:600,color:"#64748b",textTransform:"uppercase",letterSpacing:".4px",marginBottom:3,display:"block"};
  const sc={background:"#fff",borderRadius:9,padding:13,marginBottom:9,border:"1px solid #e2e8f0"};
  const sh2={fontSize:12,fontWeight:700,color:"#0f172a",marginBottom:9,display:"flex",alignItems:"center",gap:6};
  return (
    <div style={{minHeight:"100vh",background:"#f1f5f9"}}>
      <div style={{background:"linear-gradient(135deg,#312e81,#6366f1)",padding:"11px 24px 15px"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <BackBtn onClick={onBack} label={folder.nome}/>
          <div style={{display:"flex",gap:5}}>
            {!ed&&<button onClick={()=>setEd(true)} style={{padding:"4px 10px",borderRadius:4,border:"1px solid rgba(255,255,255,.3)",background:"rgba(255,255,255,.1)",color:"#fff",fontSize:10,fontWeight:600,cursor:"pointer"}}>✏️ Editar</button>}
            {(ed||dirty)&&<button onClick={doSave} style={{padding:"4px 10px",borderRadius:4,border:"none",background:"#f59e0b",color:"#0f172a",fontSize:10,fontWeight:700,cursor:"pointer"}}>💾 Guardar</button>}
          </div>
        </div>
        <div style={{marginTop:5}}>
          <div style={{fontSize:9,color:"rgba(255,255,255,.4)",fontWeight:600,letterSpacing:1}}>REUNIÃO</div>
          <h1 style={{fontSize:17,fontWeight:800,color:"#fff",margin:"2px 0 0"}}>{r.titulo||"Nova Reunião"}</h1>
        </div>
      </div>
      <div style={{padding:"11px 24px 32px",maxWidth:600,margin:"0 auto"}}>
        {/* Identificação */}
        <div style={sc}>
          <div style={sh2}>🏷️ Identificação</div>
          <div style={{marginBottom:7}}><label style={lb}>Título</label><input style={fl} value={r.titulo} onChange={e=>set("titulo",e.target.value)} readOnly={!ed}/></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
            <div><label style={lb}>Data</label><input type="date" style={fl} value={r.data} onChange={e=>set("data",e.target.value)} readOnly={!ed}/></div>
            <div><label style={lb}>Participantes</label><input style={fl} value={r.participantes} onChange={e=>set("participantes",e.target.value)} readOnly={!ed} placeholder="Miguel, João..."/></div>
          </div>
        </div>

        {/* Notas */}
        <div style={sc}>
          <div style={sh2}>📝 Notas / Decisões</div>
          <textarea style={{...fl,resize:"vertical",minHeight:120,border:"1px solid "+(ed?"#e2e8f0":"#f1f5f9"),background:ed?"#fff":"#f8fafc"}} value={r.notas||""} onChange={e=>set("notas",e.target.value)} readOnly={!ed} placeholder={ed?"Escreve as notas da reunião...":"Sem notas"}/>
        </div>

        {/* Checklist */}
        <div style={sc}>
          <div style={sh2}>✅ Checklist ({pending.length} pendentes)</div>
          {ed&&(<div style={{display:"flex",gap:4,marginBottom:7}}>
            <input style={{...fl,flex:1,border:"1px solid #e2e8f0",background:"#fff"}} placeholder="Nova ação..." value={newCheck} onChange={e=>setNewCheck(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addCheck();}}/>
            <button onClick={addCheck} style={{padding:"0 9px",borderRadius:5,border:"none",background:"#6366f1",color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer"}}>+</button>
          </div>)}
          {pending.map(c=>(<div key={c.id} style={{display:"flex",alignItems:"center",gap:2,borderBottom:"1px solid #f8fafc"}}>
            <div style={{flex:1}}><Toggle checked={false} onChange={()=>{toggleCheck(c.id);}} label={c.texto} strikethrough/></div>
            {ed&&<button onClick={()=>removeCheck(c.id)} style={{background:"none",border:"none",color:"#dc2626",cursor:"pointer",fontSize:10,opacity:.3}}>✕</button>}
          </div>))}
          {done.length>0&&(<div><div style={{fontSize:9,color:"#94a3b8",fontWeight:600,marginTop:8,marginBottom:2}}>FEITAS ({done.length})</div>
            {done.map(c=>(<div key={c.id} style={{display:"flex",alignItems:"center",gap:2,opacity:.5,borderBottom:"1px solid #fafbfc"}}>
              <div style={{flex:1}}><Toggle checked={true} onChange={()=>{toggleCheck(c.id);}} label={c.texto} strikethrough/></div>
              {ed&&<button onClick={()=>removeCheck(c.id)} style={{background:"none",border:"none",color:"#dc2626",cursor:"pointer",fontSize:10,opacity:.3}}>✕</button>}
            </div>))}
          </div>)}
          {pending.length===0&&done.length===0&&<div style={{color:"#94a3b8",fontSize:10,textAlign:"center",padding:4}}>Sem itens</div>}
        </div>

        {/* Actions */}
        <div style={{display:"flex",justifyContent:"center",gap:16,paddingTop:3}}>
          <button onClick={()=>{if(confirm("Eliminar esta reunião?"))onDelete(r.id);}} style={{background:"none",border:"none",color:"#dc2626",fontSize:10,cursor:"pointer"}}>🗑 Eliminar</button>
        </div>

        {(ed||dirty)&&(<div style={{position:"fixed",bottom:10,right:10,background:"#0f172a",padding:"6px 12px",borderRadius:7,boxShadow:"0 4px 20px rgba(0,0,0,.3)",display:"flex",alignItems:"center",gap:6,zIndex:100}}><span style={{color:"#94a3b8",fontSize:10}}>Por guardar</span><button onClick={doSave} style={{padding:"5px 10px",borderRadius:4,border:"none",background:"#f59e0b",color:"#0f172a",fontWeight:700,fontSize:10,cursor:"pointer"}}>💾 Guardar</button></div>)}
      </div>
    </div>
  );
}

/* ── APP ── */
function App() {
  const [obras,setObras]=useState([]);const [events,setEvents]=useState([]);const [todos,setTodos]=useState([]);const [contacts,setContacts]=useState([]);const [reunioes,setReunioes]=useState([]);const [excelHistorico,setExcelHistorico]=useState([]);const [excelMeta,setExcelMeta]=useState(null);
  const [loaded,setLoaded]=useState(false);const [page,setPage]=useState("home");const [cT,setCT]=useState(null);const [cO,setCO]=useState(null);const [isN,setIsN]=useState(false);
  const [cFolder,setCFolder]=useState(null);const [cReuniao,setCReuniao]=useState(null);
  const notif=useNotifications(obras,events);

  useEffect(()=>{
    let count=0;const done=()=>{count++;if(count>=6){setLoaded(true);}};
    window.dataStore.load("obras",(d)=>{setObras(d);done();});
    window.dataStore.load("events",(d)=>{setEvents(d);done();});
    window.dataStore.load("todos",(d)=>{setTodos(d);done();});
    window.dataStore.load("contacts",(d)=>{setContacts(d);done();});
    window.dataStore.load("reunioes",(d)=>{setReunioes(d);done();});
    window.dataStore.load("excelHistorico",(d)=>{setExcelHistorico(d);done();});
    try{const em=localStorage.getItem("excel_meta");if(em)setExcelMeta(JSON.parse(em));}catch(e){}
    const u1=window.dataStore.listen("obras",(d)=>setObras(d));
    const u2=window.dataStore.listen("events",(d)=>setEvents(d));
    const u3=window.dataStore.listen("todos",(d)=>setTodos(d));
    const u4=window.dataStore.listen("contacts",(d)=>setContacts(d));
    const u5=window.dataStore.listen("reunioes",(d)=>setReunioes(d));
    const u7=window.dataStore.listen("excelHistorico",(d)=>setExcelHistorico(d));
    return ()=>{u1();u2();u3();u4();u5();u7();};
  },[]);

  const pO=useCallback((n)=>{setObras(n);window.dataStore.save("obras",n);},[]);
  const pE=useCallback((n)=>{setEvents(n);window.dataStore.save("events",n);},[]);
  const pT=useCallback((n)=>{setTodos(n);window.dataStore.save("todos",n);},[]);
  const pC=useCallback((n)=>{setContacts(n);window.dataStore.save("contacts",n);},[]);
  const pR=useCallback((n)=>{setReunioes(n);window.dataStore.save("reunioes",n);},[]);
  const pXH=useCallback((n)=>{setExcelHistorico(n);window.dataStore.save("excelHistorico",n);},[]);

  const nH=()=>{setPage("home");setCT(null);setCO(null);setCFolder(null);setCReuniao(null);};
  const nCat=(t)=>{setPage("cat");setCT(t);setCO(null);};
  const nOb=(o)=>{setPage("obra");setCO(o);setIsN(false);};
  const nNew=(t)=>{setCO({...EMPTY_OBRA,id:uid(),dataCriacao:new Date().toISOString(),tipo:t||"PLR"});setIsN(true);setPage("obra");};
  const nOA=(o)=>{setCT(o.tipo);setCO(o);setIsN(false);setPage("obra");};
  const nReun=()=>{setPage("reunioes");setCFolder(null);setCReuniao(null);};
  const nAnalise=()=>{setPage("analise");};
  const nExcel=()=>{setPage("excel");};
  const nFolder=(f)=>{setPage("reunioes-folder");setCFolder(f);setCReuniao(null);};
  const nReunDetail=(r)=>{setPage("reuniao-detail");setCReuniao(r);};

  const doSv=(obra)=>{const ex=obras.find(o=>o.id===obra.id);pO(ex?obras.map(o=>o.id===obra.id?obra:o):[...obras,obra]);setCO(obra);setIsN(false);};
  const doDl=(id)=>{pO(obras.filter(o=>o.id!==id));cT?nCat(cT):nH();};

  // Reunioes handlers
  const addFolder=(nome)=>{pR([...reunioes,{id:uid(),nome,icon:"📁",reunioes:[],dataCriacao:new Date().toISOString()}]);};
  const removeFolder=(id)=>{pR(reunioes.filter(f=>f.id!==id));};
  const renameFolder=(id,nome)=>{pR(reunioes.map(f=>f.id===id?{...f,nome}:f));};
  const addReuniao=(folderId,reuniao)=>{pR(reunioes.map(f=>f.id===folderId?{...f,reunioes:[...f.reunioes,reuniao]}:f));};
  const updateReuniao=(folderId,reuniao)=>{pR(reunioes.map(f=>f.id===folderId?{...f,reunioes:f.reunioes.map(r=>r.id===reuniao.id?reuniao:r)}:f));};
  const removeReuniao=(folderId,reuniaoId)=>{pR(reunioes.map(f=>f.id===folderId?{...f,reunioes:f.reunioes.filter(r=>r.id!==reuniaoId)}:f));};

  if (!loaded) return (<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",background:"#0f172a",color:"#64748b",gap:12}}><div style={{fontSize:24,fontWeight:800,color:"#fff"}}>Gestor<span style={{color:"#f59e0b"}}>Obras</span></div><div style={{fontSize:12}}>A sincronizar...</div></div>);

  if (page==="excel") return (<ExcelAnalise onBack={nH} historico={excelHistorico} onUpdateHistorico={pXH} onUpdateMeta={(m)=>setExcelMeta(m)}/>);
  if (page==="reuniao-detail"&&cReuniao&&cFolder) return (<ReuniaoDetailPage reuniao={cReuniao} folder={cFolder} onBack={()=>nFolder(cFolder)} onSave={(r)=>{updateReuniao(cFolder.id,r);setCReuniao(r);}} onDelete={(rid)=>{removeReuniao(cFolder.id,rid);nFolder(cFolder);}}/>);
  if (page==="reunioes-folder"&&cFolder) {const fresh=reunioes.find(f=>f.id===cFolder.id)||cFolder; return (<ReunioesFolder folder={fresh} onBack={nReun} onSelect={nReunDetail} onAdd={(r)=>addReuniao(fresh.id,r)} onRename={(nome)=>renameFolder(fresh.id,nome)} onDeleteFolder={()=>{removeFolder(fresh.id);nReun();}}/>);}
  if (page==="reunioes") return (<ReunioesLanding folders={reunioes} onBack={nH} onSelect={nFolder} onAdd={addFolder} onDelete={removeFolder}/>);
  if (page==="obra"&&cO) return (<ObraPage obra={cO} isNew={isN} onBack={()=>cT?nCat(cT):nH()} onSave={doSv} onDelete={doDl}/>);
  if (page==="cat"&&cT) return (<Category tipo={cT} obras={obras} onBack={nH} onSelect={nOb} onNew={()=>nNew(cT)}/>);
  return (<Landing obras={obras} onType={nCat} onNew={()=>nNew()} onSelObra={nOA} onReunioes={nReun} onExcel={nExcel} reunioes={reunioes} excelMeta={excelMeta} events={events} onAddEv={e=>pE([...events,e])} onRemEv={id=>pE(events.filter(e=>e.id!==id))} todos={todos} onAddTd={t=>pT([...todos,t])} onTogTd={id=>pT(todos.map(t=>t.id===id?{...t,concluida:!t.concluida}:t))} onRemTd={id=>pT(todos.filter(t=>t.id!==id))} contacts={contacts} onAddCt={c=>pC([...contacts,c])} onRemCt={id=>pC(contacts.filter(c=>c.id!==id))} notif={notif}/>);
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
