  appId: "1:314932781905:web:1b2cf8b984f971b25d2970"
});
var db = firebase.firestore();

// Storage layer with Firebase + localStorage cache
window.dataStore = {
  save: function(collection, data) {
    try { localStorage.setItem('go-'+collection, JSON.stringify(data)); } catch(e) {}
    db.collection('userData').doc(collection).set({ data: JSON.stringify(data), updated: new Date().toISOString() })
      .catch(function(e) { console.warn('Firebase save error:', e); });
  },
  load: function(collection, callback) {
    // Load from localStorage first (instant)
    var cached = null;
    try { var raw = localStorage.getItem('go-'+collection); if(raw) cached = JSON.parse(raw); } catch(e) {}
    if (cached) callback(cached);
    // Then sync from Firebase
    db.collection('userData').doc(collection).get()
      .then(function(doc) {
        if (doc.exists) {
          var data = JSON.parse(doc.data().data);
          try { localStorage.setItem('go-'+collection, JSON.stringify(data)); } catch(e) {}
          callback(data);
        } else if (!cached) {
          callback([]);
        }
      })
      .catch(function(e) { console.warn('Firebase load error:', e); if(!cached) callback([]); });
  },
  listen: function(collection, callback) {
    return db.collection('userData').doc(collection).onSnapshot(function(doc) {
      if (doc.exists) {
        var data = JSON.parse(doc.data().data);
        try { localStorage.setItem('go-'+collection, JSON.stringify(data)); } catch(e) {}
        callback(data);
      }
    }, function(e) { console.warn('Firebase listen error:', e); });
  }
};
</script>

<script type="text/babel">

  OCR:{label:"OCR",desc:"Conservação e reparação",icon:"🔧",bg:"linear-gradient(135deg,#78350f,#d97706)",accent:"#d97706",card:"#fef3c7",dark:"#78350f"},

const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtD = (d) => {if(!d) return "—";return new Date(d).toLocaleDateString("pt-PT",{day:"2-digit",month:"2-digit",year:"numeric"});};
const fmtDT = (d) => {if(!d) return "";return new Date(d).toLocaleDateString("pt-PT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});};
const daysBetween = (a,b) => Math.floor((new Date(b)-new Date(a))/86400000);

const toKey = (d) => d.toISOString().slice(0,10);

const EMPTY_OBRA = {
  id:"",tipo:"PLR",numero:"",designacao:"",concelho:"",pse:"",estadoAtual:"",
  dataUltimaConsulta:"",dataInicio:"",dataFim:"",temLicenciamento:false,
  estadoLicenciamento:"",pssRecebido:false,obraCompleta:false,reuniaoTerreno:false,
  reuniaoEntidades:false,problemasMateriais:false,notasMateriais:"",corteMarcado:false,
  dataCorte:"",sitEncerrado:false,latitude:"",longitude:"",dps:[],tarefas:[],notas:[],

/* ── UI Components ── */

function BackBtn({onClick,label}) {

function Pill({active,label,color}) {

function MapEmbed({lat,lng}) {
  if (!lat||!lng||isNaN(lat)||isNaN(lng)) {
    return (<div style={{height:150,borderRadius:10,background:"#f1f5f9",display:"flex",alignItems:"center",justifyContent:"center",border:"2px dashed #cbd5e1",color:"#94a3b8",fontSize:12}}>📍 Sem coordenadas</div>);
  }
  const url = "https://www.openstreetmap.org/export/embed.html?bbox="+(lng-.006)+"%2C"+(lat-.004)+"%2C"+(lng+.006)+"%2C"+(lat+.004)+"&layer=mapnik&marker="+lat+"%2C"+lng;
  return (<div style={{borderRadius:10,overflow:"hidden",border:"1px solid #e2e8f0",height:150}}><iframe src={url} width="100%" height="150" style={{border:0,display:"block"}} title="Mapa" loading="lazy"/></div>);

function WBox({children,style:sx}) {
  return (<div style={{background:"#1e293b",borderRadius:12,padding:14,border:"1px solid #334155",...sx}}>{children}</div>);
}

function WTitle({icon,text,right}) {
  return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>

      {right}
    </div>

}

/* ── Alerts ── */
function getAlerts(obras) {
  const al = [];
  obras.filter(o => !o.arquivada&&!o.concluida).forEach(o => {
    const lim = o.alertaDias||10;
    const h = o.historicoEstados||[];
    const d2 = h.length>0 ? h[h.length-1].data : o.dataCriacao;
    const de = daysAgo(d2);
    if (d2 && de>=lim) al.push({tipo:"estado",obra:o,dias:de,msg:"Sem mudança há "+de+"d"});
    if (o.corteMarcado && o.dataCorte) {
      const dd = daysBetween(new Date().toISOString(),o.dataCorte);
      if (dd>=0 && dd<=3) al.push({tipo:"corte",obra:o,dias:dd,msg:dd===0?"Corte HOJE!":"Corte em "+dd+"d"});
    }
    if (o.problemasMateriais) al.push({tipo:"mat",obra:o,dias:0,msg:"Problema materiais"});
  });
  al.sort((a,b) => a.tipo==="corte"?-1:b.tipo==="corte"?1:b.dias-a.dias);
  return al;
}
const aI = {estado:"🔴",consulta:"🟡",corte:"🟠",mat:"⚠️"};
const aC2 = {estado:"#dc2626",consulta:"#d97706",corte:"#ea580c",mat:"#dc2626"};

/* ── Activity Feed ── */
function getActivity(obras) {
  const acts = [];
  obras.filter(o => !o.arquivada).forEach(o => {
    (o.historicoEstados||[]).forEach(h => acts.push({date:h.data,icon:"🔄",text:(o.numero||"—")+" → "+h.estado,tipo:o.tipo}));
    (o.tarefas||[]).filter(t => t.concluida&&t.dataConclusao).forEach(t => acts.push({date:t.dataConclusao,icon:"✅",text:(o.numero||"—")+" — "+t.texto,tipo:o.tipo}));
    (o.notas||[]).forEach(n => acts.push({date:n.data,icon:"📝",text:(o.numero||"—")+" — nota",tipo:o.tipo}));
  });
  acts.sort((a,b) => new Date(b.date)-new Date(a.date));
  return acts.slice(0,8);
}

/* ── Calendar Widget ── */
function CalendarW({events,onAdd,onRemove}) {
  const [vw,setVw] = useState(new Date());
  const [sel,setSel] = useState(null);
  const [nT,setNT] = useState("");
  const [nH,setNH] = useState("");
  const y = vw.getFullYear(), mo = vw.getMonth();
  const sd = (new Date(y,mo,1).getDay()+6)%7;
  const dim = new Date(y,mo+1,0).getDate();
  const td = toKey(new Date());
  const cells = [];
  for (let i=0;i<sd;i++) cells.push(null);
  for (let d=1;d<=dim;d++) cells.push(d);
  const evD = (d) => {
    if (!d) return [];
    const k = y+"-"+String(mo+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    return (events||[]).filter(e => e.data===k).sort((a,b) => (a.hora||"").localeCompare(b.hora||""));
  };
  const sk = sel ? y+"-"+String(mo+1).padStart(2,"0")+"-"+String(sel).padStart(2,"0") : null;
  const doAdd = () => {
    if (!nT.trim()||!sk) return;
    onAdd({id:uid(),data:sk,texto:nT.trim(),hora:nH||""});
    setNT("");setNH("");
  };
  return (
    <WBox>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <button onClick={()=>{setVw(new Date(y,mo-1,1));setSel(null);}} style={{background:"none",border:"none",color:"#94a3b8",fontSize:16,cursor:"pointer"}}>‹</button>
        <div style={{fontSize:13,fontWeight:700,color:"#fff"}}>{MP[mo]} {y}</div>
        <button onClick={()=>{setVw(new Date(y,mo+1,1));setSel(null);}} style={{background:"none",border:"none",color:"#94a3b8",fontSize:16,cursor:"pointer"}}>›</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:2}}>
        {DP2.map(d => <div key={d} style={{textAlign:"center",fontSize:9,color:"#64748b",fontWeight:600}}>{d}</div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
        {cells.map((d,i) => {
          if (!d) return <div key={i}/>;
          const k = y+"-"+String(mo+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
          const isT = k===td, isS = d===sel, has = evD(d).length>0;
          return (
            <div key={i} onClick={()=>setSel(d===sel?null:d)} style={{textAlign:"center",padding:"5px 0",borderRadius:5,cursor:"pointer",background:isS?"#f59e0b":isT?"#334155":"transparent",color:isS?"#0f172a":isT?"#f59e0b":"#e2e8f0",fontWeight:isT||isS?700:400,fontSize:11}}>
              {d}{has && <div style={{width:4,height:4,borderRadius:2,background:isS?"#0f172a":"#f59e0b",margin:"1px auto 0"}}/>}
            </div>
          );
        })}
      </div>
      {sel && (
        <div style={{marginTop:8,borderTop:"1px solid #334155",paddingTop:6}}>
          <div style={{fontSize:11,fontWeight:600,color:"#f59e0b",marginBottom:4}}>{sel} {MP[mo]}</div>
          {evD(sel).map(e => (
            <div key={e.id} style={{display:"flex",alignItems:"center",gap:6,padding:"3px 0",borderBottom:"1px solid #334155"}}>
              {e.hora && <span style={{fontSize:10,color:"#f59e0b",fontFamily:"monospace",minWidth:36}}>{e.hora}</span>}
              <span style={{fontSize:11,color:"#e2e8f0",flex:1}}>{e.texto}</span>
              <button onClick={()=>onRemove(e.id)} style={{background:"#dc262620",border:"1px solid #dc262640",borderRadius:4,color:"#f87171",cursor:"pointer",fontSize:11,padding:"2px 8px",fontWeight:600}}>✕</button>
            </div>
          ))}
          {evD(sel).length===0 && <div style={{fontSize:10,color:"#64748b",padding:"2px 0"}}>Sem eventos</div>}
          <div style={{display:"flex",gap:4,marginTop:6}}>
            <input style={{width:50,padding:"4px 5px",borderRadius:4,border:"1px solid #475569",background:"#0f172a",color:"#e2e8f0",fontSize:10,outline:"none"}} type="time" value={nH} onChange={e=>setNH(e.target.value)}/>
            <input style={{flex:1,padding:"4px 7px",borderRadius:4,border:"1px solid #475569",background:"#0f172a",color:"#e2e8f0",fontSize:10,outline:"none"}} placeholder="Novo evento..." value={nT} onChange={e=>setNT(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")doAdd();}}/>
            <button onClick={doAdd} style={{padding:"3px 8px",borderRadius:4,border:"none",background:"#f59e0b",color:"#0f172a",fontWeight:700,fontSize:11,cursor:"pointer"}}>+</button>
          </div>
        </div>
      )}
    </WBox>
  );
}

        {fl.map(c => (

        <div style={sc}><div style={sh2}>🏷️ Identificação</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}><div><label style={lb}>Número</label><input style={fl} value={o.numero} onChange={e=>set("numero",e.target.value)} readOnly={!ed}/></div><div><label style={lb}>Concelho</label><input style={fl} value={o.concelho} onChange={e=>set("concelho",e.target.value)} readOnly={!ed}/></div></div><div style={{marginTop:7}}><label style={lb}>Designação</label><input style={fl} value={o.designacao} onChange={e=>set("designacao",e.target.value)} readOnly={!ed}/></div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginTop:7}}><div><label style={lb}>PSE</label><input style={fl} value={o.pse} onChange={e=>set("pse",e.target.value)} readOnly={!ed}/></div><div><label style={lb}>Estado</label><input style={{...fl,borderColor:ed?"#3b82f6":"#f1f5f9",fontWeight:600}} value={o.estadoAtual} onChange={e=>set("estadoAtual",e.target.value)} readOnly={!ed}/></div></div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:7,marginTop:7}}><div><label style={lb}>Início</label><input type="date" style={fl} value={o.dataInicio} onChange={e=>set("dataInicio",e.target.value)} readOnly={!ed}/></div><div><label style={lb}>Fim</label><input type="date" style={fl} value={o.dataFim} onChange={e=>set("dataFim",e.target.value)} readOnly={!ed}/></div><div><label style={lb}>Consulta</label><input type="date" style={fl} value={o.dataUltimaConsulta} onChange={e=>set("dataUltimaConsulta",e.target.value)} readOnly={!ed}/></div></div>{ed&&<div style={{marginTop:7,display:"flex",alignItems:"center",gap:5}}><label style={{...lb,marginBottom:0}}>⏰ Alerta</label><input type="number" min="1" max="90" style={{...fl,width:46,textAlign:"center",padding:"3px 5px"}} value={o.alertaDias||10} onChange={e=>set("alertaDias",parseInt(e.target.value)||10)}/><span style={{fontSize:9,color:"#94a3b8"}}>dias</span></div>}</div>
        {hi.length>0&&(<div style={sc}><div style={{...sh2,cursor:"pointer"}} onClick={()=>setSH(!sH)}>📊 Histórico ({hi.length}) <span style={{fontSize:10,color:"#94a3b8",marginLeft:"auto"}}>{sH?"▲":"▼"}</span></div>{sH?hi.map((h,i) => (<div key={i} style={{display:"flex",alignItems:"center",gap:7,padding:"5px 0",borderBottom:i<hi.length-1?"1px solid #f1f5f9":"none"}}><div style={{width:7,height:7,borderRadius:4,background:i===0?m.accent:"#cbd5e1",flexShrink:0}}/><div><div style={{fontSize:11,fontWeight:600,color:i===0?"#0f172a":"#64748b"}}>{h.estado}</div><div style={{fontSize:9,color:"#94a3b8"}}>{fmtDT(h.data)} {h.anterior!=="—"?"← "+h.anterior:""}</div></div></div>)):<div style={{fontSize:11,color:"#64748b"}}>Último: <strong>{hi[0]?hi[0].estado:""}</strong> ({hi[0]?fmtD(hi[0].data):""})</div>}</div>)}
        <div style={sc}><div style={sh2}>📐 DPs & OTs</div>{(o.dps||[]).map(dp => (<div key={dp.id} style={{background:"#f8fafc",borderRadius:5,padding:8,marginBottom:4,border:"1px solid #f1f5f9"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:2}}><span style={{fontWeight:700,fontSize:11,color:m.accent,fontFamily:"monospace"}}>DP: {dp.numero}</span>{ed&&<button onClick={()=>rDp(dp.id)} style={{background:"none",border:"none",color:"#dc2626",cursor:"pointer",fontSize:10,opacity:.4}}>✕</button>}</div>{dp.ots.map(ot => (<div key={ot.id} style={{display:"flex",gap:4,alignItems:"center",padding:"2px 0 2px 8px",fontSize:10,color:"#475569"}}><span style={{color:"#94a3b8"}}>└</span><span style={{fontFamily:"monospace",fontWeight:600}}>OT {ot.numero}</span>{ot.descricao&&<span style={{color:"#94a3b8"}}>· {ot.descricao}</span>}{ed&&<button onClick={()=>rOt(dp.id,ot.id)} style={{background:"none",border:"none",color:"#dc2626",cursor:"pointer",fontSize:9,opacity:.3,marginLeft:"auto"}}>✕</button>}</div>))}{ed&&dpA===dp.id?(<div style={{display:"flex",gap:3,marginTop:3,flexWrap:"wrap"}}><input style={{...fl,flex:1,minWidth:50,maxWidth:90,padding:"3px 4px",fontSize:10}} placeholder="OT" value={nON} onChange={e=>setNON(e.target.value)}/><input style={{...fl,flex:2,minWidth:70,padding:"3px 4px",fontSize:10}} placeholder="Desc" value={nOD} onChange={e=>setNOD(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")aOt(dp.id);}}/><button onClick={()=>aOt(dp.id)} style={{padding:"2px 6px",borderRadius:3,border:"none",background:m.accent,color:"#fff",fontSize:9,cursor:"pointer"}}>+</button></div>):ed&&<button onClick={()=>setDpA(dp.id)} style={{background:"none",border:"none",color:m.accent,fontSize:9,cursor:"pointer",marginTop:1}}>+ OT</button>}</div>))}{ed&&(<div style={{display:"flex",gap:3,marginTop:2}}><input style={{...fl,flex:1,padding:"5px 7px",fontSize:10}} placeholder="Nova DP" value={nDp} onChange={e=>setNDp(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")aDp();}}/><button onClick={aDp} style={{padding:"4px 8px",borderRadius:4,border:"none",background:m.accent,color:"#fff",fontSize:10,fontWeight:600,cursor:"pointer"}}>+ DP</button></div>)}{(!o.dps||o.dps.length===0)&&!ed&&<div style={{color:"#94a3b8",fontSize:10,textAlign:"center",padding:4}}>Sem DPs</div>}</div>
        <div style={sc}><div style={sh2}>📍 Localização</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:7}}><div><label style={lb}>Lat</label><input style={fl} value={o.latitude} onChange={e=>set("latitude",e.target.value)} readOnly={!ed} placeholder="40.8387"/></div><div><label style={lb}>Lng</label><input style={fl} value={o.longitude} onChange={e=>set("longitude",e.target.value)} readOnly={!ed} placeholder="-8.4774"/></div></div><MapEmbed lat={parseFloat(o.latitude)} lng={parseFloat(o.longitude)}/></div>
        <div style={sc}><div style={sh2}>✅ Checklist ({tP.length})</div><div style={{display:"flex",gap:4,marginBottom:7}}><input style={{...fl,flex:1,border:"1px solid #e2e8f0",background:"#fff"}} placeholder="Nova tarefa..." value={nT} onChange={e=>setNT(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")aT();}}/><button onClick={aT} style={{padding:"0 9px",borderRadius:5,border:"none",background:m.accent,color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer"}}>+</button></div>{tP.map(t => (<div key={t.id} style={{display:"flex",alignItems:"center",gap:2,borderBottom:"1px solid #f8fafc"}}><div style={{flex:1}}><Toggle checked={false} onChange={()=>tT(t.id)} label={t.texto} strikethrough/></div><button onClick={()=>rT(t.id)} style={{background:"none",border:"none",color:"#dc2626",cursor:"pointer",fontSize:10,opacity:.3}}>✕</button></div>))}{tD.length>0&&(<div><div style={{fontSize:9,color:"#94a3b8",fontWeight:600,marginTop:8,marginBottom:2}}>FEITAS ({tD.length})</div>{tD.map(t => (<div key={t.id} style={{display:"flex",alignItems:"center",gap:2,opacity:.5,borderBottom:"1px solid #fafbfc"}}><div style={{flex:1}}><Toggle checked={true} onChange={()=>tT(t.id)} label={t.texto} strikethrough/></div><span style={{fontSize:9,color:"#94a3b8"}}>{fmtD(t.dataConclusao)}</span><button onClick={()=>rT(t.id)} style={{background:"none",border:"none",color:"#dc2626",cursor:"pointer",fontSize:10,opacity:.3}}>✕</button></div>))}</div>)}</div>
        <div style={sc}><div style={sh2}>📋 Licenciamento</div><Toggle checked={o.temLicenciamento} onChange={v=>ed&&set("temLicenciamento",v)} label="Tem licenciamento"/>{o.temLicenciamento&&<div style={{marginLeft:48,marginTop:3}}><input style={fl} value={o.estadoLicenciamento} onChange={e=>set("estadoLicenciamento",e.target.value)} readOnly={!ed}/></div>}<Toggle checked={o.pssRecebido} onChange={v=>ed&&set("pssRecebido",v)} label="PSS recebido"/><Toggle checked={o.obraCompleta} onChange={v=>ed&&set("obraCompleta",v)} label="Obra completa"/></div>
        <div style={sc}><div style={sh2}>🔍 Acompanhamento</div><Toggle checked={o.reuniaoTerreno} onChange={v=>ed&&set("reuniaoTerreno",v)} label="Reunião terreno"/><Toggle checked={o.reuniaoEntidades} onChange={v=>ed&&set("reuniaoEntidades",v)} label="Reunião entidades"/><Toggle checked={o.problemasMateriais} onChange={v=>ed&&set("problemasMateriais",v)} label="Problemas materiais"/>{o.problemasMateriais&&<div style={{marginLeft:48}}><input style={fl} value={o.notasMateriais} onChange={e=>set("notasMateriais",e.target.value)} readOnly={!ed}/></div>}<Toggle checked={o.corteMarcado} onChange={v=>ed&&set("corteMarcado",v)} label="Corte marcado"/>{o.corteMarcado&&<div style={{marginLeft:48}}><input type="date" style={{...fl,maxWidth:140}} value={o.dataCorte} onChange={e=>set("dataCorte",e.target.value)} readOnly={!ed}/></div>}<Toggle checked={o.sitEncerrado} onChange={v=>ed&&set("sitEncerrado",v)} label="SIT encerrado"/><Toggle checked={o.concluida} onChange={v=>ed&&set("concluida",v)} label="Obra concluída"/></div>
        <div style={sc}><div style={sh2}>📝 Diário</div><div style={{display:"flex",gap:4,marginBottom:7}}><textarea style={{...fl,resize:"vertical",minHeight:34,flex:1,border:"1px solid #e2e8f0",background:"#fff"}} value={nN} onChange={e=>setNN(e.target.value)} placeholder="Nota..." onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();aN();}}}/><button onClick={aN} style={{padding:"0 9px",borderRadius:5,border:"none",background:m.accent,color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer",alignSelf:"stretch"}}>+</button></div><div style={{maxHeight:200,overflowY:"auto"}}>{(o.notas||[]).slice().reverse().map(n => (<div key={n.id} style={{background:"#fafbfc",borderRadius:5,padding:"6px 9px",border:"1px solid #f1f5f9",marginBottom:3}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}><span style={{fontSize:9,color:"#94a3b8",fontWeight:600}}>{fmtDT(n.data)}</span><button onClick={()=>rN(n.id)} style={{background:"none",border:"none",color:"#dc2626",cursor:"pointer",fontSize:10,opacity:.3}}>✕</button></div><div style={{fontSize:11,color:"#334155",whiteSpace:"pre-wrap",lineHeight:1.5}}>{n.texto}</div></div>))}{(!o.notas||o.notas.length===0)&&<div style={{color:"#94a3b8",fontSize:10,textAlign:"center",padding:6}}>Sem notas</div>}</div></div>
        {!isNew&&(<div style={{display:"flex",justifyContent:"center",gap:16,paddingTop:3}}><button onClick={()=>set("arquivada",!o.arquivada)} style={{background:"none",border:"none",color:"#64748b",fontSize:10,cursor:"pointer"}}>📦 {o.arquivada?"Desarquivar":"Arquivar"}</button><button onClick={()=>{if(confirm("Eliminar?"))onDelete(o.id);}} style={{background:"none",border:"none",color:"#dc2626",fontSize:10,cursor:"pointer"}}>🗑 Eliminar</button></div>)}
        {(ed||dirty)&&(<div style={{position:"fixed",bottom:10,right:10,background:"#0f172a",padding:"6px 12px",borderRadius:7,boxShadow:"0 4px 20px rgba(0,0,0,.3)",display:"flex",alignItems:"center",gap:6,zIndex:100}}><span style={{color:"#94a3b8",fontSize:10}}>Por guardar</span><button onClick={doSave} style={{padding:"5px 10px",borderRadius:4,border:"none",background:"#f59e0b",color:"#0f172a",fontWeight:700,fontSize:10,cursor:"pointer"}}>💾 Guardar</button></div>)}
      </div>
    </div>
  );
}

/* ── MAIN APP ── */
function App() {
  const [obras,setObras] = useState([]);
  const [events,setEvents] = useState([]);
  const [todos,setTodos] = useState([]);
  const [contacts,setContacts] = useState([]);
  const [loaded,setLoaded] = useState(false);
  const [page,setPage] = useState("home");
  const [cT,setCT] = useState(null);
  const [cO,setCO] = useState(null);
  const [isN,setIsN] = useState(false);
  const [syncing,setSyncing] = useState(true);

  useEffect(() => {
    let count = 0;
    const done = () => {count++;if(count>=4){setLoaded(true);setSyncing(false);}};
    window.dataStore.load("obras", (d) => {setObras(d);done();});
    window.dataStore.load("events", (d) => {setEvents(d);done();});
    window.dataStore.load("todos", (d) => {setTodos(d);done();});
    window.dataStore.load("contacts", (d) => {setContacts(d);done();});

    // Listen for real-time changes from other devices
    const unsub1 = window.dataStore.listen("obras", (d) => setObras(d));
    const unsub2 = window.dataStore.listen("events", (d) => setEvents(d));
    const unsub3 = window.dataStore.listen("todos", (d) => setTodos(d));
    const unsub4 = window.dataStore.listen("contacts", (d) => setContacts(d));
    return () => {unsub1();unsub2();unsub3();unsub4();};
  },[]);

  const pO = useCallback((n) => {setObras(n);window.dataStore.save("obras",n);},[]);
  const pE = useCallback((n) => {setEvents(n);window.dataStore.save("events",n);},[]);
  const pT = useCallback((n) => {setTodos(n);window.dataStore.save("todos",n);},[]);
  const pC = useCallback((n) => {setContacts(n);window.dataStore.save("contacts",n);},[]);

  const nH = () => {setPage("home");setCT(null);setCO(null);};
  const nCat = (t) => {setPage("cat");setCT(t);setCO(null);};
  const nOb = (o) => {setPage("obra");setCO(o);setIsN(false);};
  const nNew = (t) => {setCO({...EMPTY_OBRA,id:uid(),dataCriacao:new Date().toISOString(),tipo:t||"PLR"});setIsN(true);setPage("obra");};
  const nOA = (o) => {setCT(o.tipo);setCO(o);setIsN(false);setPage("obra");};

  const doSv = (obra) => {
    const ex = obras.find(o => o.id===obra.id);
    pO(ex ? obras.map(o => o.id===obra.id?obra:o) : [...obras,obra]);
    setCO(obra);setIsN(false);
  };
  const doDl = (id) => {pO(obras.filter(o => o.id!==id));cT?nCat(cT):nH();};

  if (!loaded) {
    return (
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",background:"#0f172a",color:"#64748b",gap:12}}>
        <div style={{fontSize:24,fontWeight:800,color:"#fff"}}>Gestor<span style={{color:"#f59e0b"}}>Obras</span></div>
        <div style={{fontSize:12}}>A sincronizar...</div>
      </div>
    );
  }

  if (page==="obra" && cO) {
    return (<ObraPage obra={cO} isNew={isN} onBack={()=>cT?nCat(cT):nH()} onSave={doSv} onDelete={doDl}/>);
  }
  if (page==="cat" && cT) {
    return (<Category tipo={cT} obras={obras} onBack={nH} onSelect={nOb} onNew={()=>nNew(cT)}/>);
  }
  return (
    <Landing obras={obras} onType={nCat} onNew={()=>nNew()} onSelObra={nOA}
      events={events} onAddEv={e=>pE([...events,e])} onRemEv={id=>pE(events.filter(e=>e.id!==id))}
      todos={todos} onAddTd={t=>pT([...todos,t])} onTogTd={id=>pT(todos.map(t=>t.id===id?{...t,concluida:!t.concluida}:t))} onRemTd={id=>pT(todos.filter(t=>t.id!==id))}
      contacts={contacts} onAddCt={c=>pC([...contacts,c])} onRemCt={id=>pC(contacts.filter(c=>c.id!==id))}
    />
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
